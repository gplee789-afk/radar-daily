<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股分析日報</title>
<meta name="description" content="每天把所有資料元素合成一份分析：左邊是各元素的分析報告，右邊是當天最值得看的 5 個題材。">
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f2; --panel: #ffffff; --line: #dfe2dc; --grid: #ccd3cc;
  --ink: #12170f; --ink-2: #4c5549; --ink-3: #80887d;
  --ev-1: #0f5c3c; --ev-2: #2f8a63; --ev-3: #5aa785; --ev-4: #a9b3a6;
  --hub: #12170f; --hub-ink: #f4f5f2; --accent: #2a78d6; --up: #1d7a50; --down: #c0392b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0f0b; --panel: #141913; --line: #232b21; --grid: #2a3528;
    --ink: #eaf1e6; --ink-2: #a7b3a2; --ink-3: #6f7b6b;
    --ev-1: #9af5c8; --ev-2: #5cc999; --ev-3: #3f9a76; --ev-4: #4a5547;
    --hub: #eaf1e6; --hub-ink: #0c0f0b; --accent: #3987e5; --up: #5cc999; --down: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0f0b; --panel: #141913; --line: #232b21; --grid: #2a3528;
  --ink: #eaf1e6; --ink-2: #a7b3a2; --ink-3: #6f7b6b;
  --ev-1: #9af5c8; --ev-2: #5cc999; --ev-3: #3f9a76; --ev-4: #4a5547;
  --hub: #eaf1e6; --hub-ink: #0c0f0b; --accent: #3987e5; --up: #5cc999; --down: #e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 18px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 14px; }
h1 { font-size: 24px; margin: 0; }
nav { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
select, button { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
button { cursor: pointer; }
.sub { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
.main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
h2 { font-size: 17px; margin: 0 0 2px; }

/* 心智圖 */
#map { width: 100%; height: auto; display: block; }
#map .spoke { stroke: var(--grid); }
#map .node { cursor: pointer; }
#map .node circle.body { transition: transform .2s; transform-box: fill-box; transform-origin: center; }
#map .node:hover circle.body, #map .node:focus circle.body { transform: scale(1.08); }
#map .node:focus { outline: none; }
#map .nm { font-weight: 800; font-size: 14px; pointer-events: none; }
#map .meta { font-size: 10.5px; pointer-events: none; }
#map .pulse { pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -2px; }

/* 每日排行 */
.rank { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 46px 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line);
        border-radius: 12px; cursor: pointer; background: var(--panel); text-align: left; width: 100%; color: var(--ink); transition: transform .15s, border-color .15s; }
.item:hover { transform: translateX(3px); border-color: var(--ink-3); }
.item .no { font-size: 30px; font-weight: 900; color: var(--ink-3); grid-row: 1 / 3; text-align: center; font-variant-numeric: tabular-nums; }
.item .t { font-size: 16px; font-weight: 800; }
.item .sc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; }
.item .sc small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); }
.item .bar { grid-column: 2 / 4; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.item .bar i { display: block; height: 100%; background: var(--ev-2); border-radius: 99px; }
.item .cos { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-2); }
.up { color: var(--up); } .down { color: var(--down); }
.method { font-size: 12.5px; color: var(--ink-2); margin-top: 12px; }

/* 閱讀器 */
#reader { position: fixed; inset: 0; z-index: 20; display: none; }
#reader.open { display: block; }
#reader .shade { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#reader .sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(860px, 100%); background: var(--panel); border-left: 1px solid var(--line);
                 display: flex; flex-direction: column; animation: slide .25s ease-out; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
#reader .bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#reader .bar b { font-size: 14px; color: var(--ink-2); margin-right: auto; }
#doc { overflow: auto; padding: 8px 26px 40px; flex: 1; }
#doc h1 { font-size: 24px; margin: 14px 0 4px; }
#doc h2 { font-size: 19px; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
#doc h3 { font-size: 16px; margin: 18px 0 6px; }
#doc p, #doc li { line-height: 1.8; }
#doc table { border-collapse: collapse; font-size: 13px; margin: 10px 0; display: block; overflow-x: auto; }
#doc th, #doc td { border-bottom: 1px solid var(--line); padding: 6px 9px; text-align: left; white-space: nowrap; }
#doc th { color: var(--ink-2); }
#doc blockquote { margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--ev-2); color: var(--ink-2); background: var(--bg); border-radius: 0 8px 8px 0; }
#doc code { font-size: 12.5px; background: var(--bg); padding: 1px 5px; border-radius: 5px; }
@media (max-width: 640px) { #doc { padding: 6px 16px 40px; } }
footer { color: var(--ink-3); font-size: 12px; margin-top: 22px; }
@media (prefers-reduced-motion: reduce) { #reader .sheet { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📡 台股分析日報</h1>
    <nav>
      <a href="index.html">📚 報告庫</a>
      <a href="ranking.html">📊 排名總表</a>
      <a href="fvg.html">🎯 FVG 每日標的</a>
      <select id="day" aria-label="報告日期"></select>
      <button id="themeBtn" title="切換深色／淺色">◐</button>
    </nav>
  </header>

  <div class="main">
    <section class="card">
      <h2>元素合成</h2>
      <p class="sub">每個圓是一種資料元素，點開是它今天的分析報告；中間是把全部元素合在一起的報告。圓越大、線越粗，合成時的權重越高；顏色是這個元素過去的回測證據有多強。</p>
      <svg id="map" viewBox="0 0 640 600" role="img" aria-label="資料元素合成心智圖"></svg>
      <div class="legend" id="legend"></div>
    </section>

    <section class="card">
      <h2>每日排行</h2>
      <p class="sub" id="rankSub">今天合成分數最高的 5 個題材，每篇都會拆到題材裡的公司。</p>
      <div class="rank" id="rank"></div>
      <div class="method" id="method"></div>
    </section>
  </div>

  <footer>研究輔助，不是投資建議。報告文字由本機模型依程式算好的數字撰寫，數字經過自動核對；權重依回測證據等級設定，不是最佳化出來的。</footer>
</div>

<div id="reader" aria-hidden="true">
  <div class="shade" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
    <div class="bar">
      <b id="readerTitle"></b>
      <button id="prev">← 上一篇</button>
      <button id="next">下一篇 →</button>
      <button data-close>✕ 關閉</button>
    </div>
    <article id="doc"></article>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EV = { "穩健": "var(--ev-1)", "只在多頭": "var(--ev-2)", "線索": "var(--ev-3)", "參考": "var(--ev-4)" };
const EV_TXT = { "穩健": "多空都有效", "只在多頭": "只在多頭有效", "線索": "當線索用", "參考": "只供參考、不計分" };
let INDEX, B, ORDER = [], openIdx = -1;

(() => {
  let t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $("#themeBtn").onclick = () => {
    const next = getComputedStyle(document.documentElement).colorScheme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
  };
})();

async function boot() {
  INDEX = await (await fetch("data/index.json", { cache: "no-cache" })).json();
  const days = INDEX.dates.filter(d => d.briefs);
  if (!days.length) throw new Error("還沒有日報");
  $("#day").innerHTML = days.map(d => `<option>${d.date}</option>`).join("");
  const want = new URLSearchParams(location.search).get("d");
  $("#day").value = days.some(d => d.date === want) ? want : days[0].date;
  $("#day").onchange = () => load($("#day").value);
  await load($("#day").value);
  const r = new URLSearchParams(location.search).get("r");
  if (r) openReport(r);
}
async function load(day) {
  const d = INDEX.dates.find(x => x.date === day);
  B = await (await fetch(d.briefs, { cache: "no-cache" })).json();
  ORDER = [B.synthesis, ...B.elements, ...B.themes];
  renderMap(); renderRank();
  history.replaceState(null, "", "?d=" + day);
}

/* ---------- 心智圖 ---------- */
function renderMap() {
  const svg = $("#map"), C = { x: 320, y: 300 }, R = 220;
  const els = B.elements, n = els.length;
  const maxW = Math.max(...els.map(e => e.weight || 0), 1);
  const rOf = e => 26 + 18 * Math.sqrt((e.weight || 0) / maxW);
  let spokes = "", nodes = "", pulses = "";
  els.forEach((e, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    const x = C.x + R * Math.cos(a), y = C.y + R * Math.sin(a) * 0.95;
    e._x = x; e._y = y;
    const w = e.weight ? 1.5 + 5 * e.weight / maxW : 1;
    const col = EV[e.evidence] || "var(--ev-4)";
    spokes += `<line class="spoke" x1="${C.x}" y1="${C.y}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke-width="${w.toFixed(1)}" ${e.weight ? "" : 'stroke-dasharray="4 4"'}/>`;
    if (e.weight && !RM) {
      const dur = (3.2 - 1.6 * e.weight / maxW).toFixed(2);
      pulses += `<circle class="pulse" r="${(2 + 2 * e.weight / maxW).toFixed(1)}" fill="${col}">
        <animateMotion dur="${dur}s" repeatCount="indefinite" begin="${(i * 0.37).toFixed(2)}s" path="M${x.toFixed(1)},${y.toFixed(1)} L${C.x},${C.y}"/></circle>`;
    }
    const r = rOf(e), dark = e.evidence === "穩健" || e.evidence === "只在多頭";
    nodes += `<g class="node" tabindex="0" role="button" data-id="${e.id}" aria-label="${esc(e.name)}報告">
      <circle class="body" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${e.weight ? col : "var(--panel)"}" stroke="${col}" stroke-width="2.5" ${e.weight ? "" : 'stroke-dasharray="5 4"'}/>
      <text class="nm" x="${x.toFixed(1)}" y="${(y + 1).toFixed(1)}" text-anchor="middle" fill="${e.weight && dark ? "var(--hub-ink)" : "var(--ink)"}">${esc(e.short)}</text>
      <text class="meta" x="${x.toFixed(1)}" y="${(y + 15).toFixed(1)}" text-anchor="middle" fill="${e.weight && dark ? "var(--hub-ink)" : "var(--ink-2)"}">${e.weight ? "權重 " + e.weight : "不計分"}</text>
      <text class="meta" x="${x.toFixed(1)}" y="${(y + r + 15).toFixed(1)}" text-anchor="middle" fill="var(--ink-2)">${esc(e.metric || "")}</text>
    </g>`;
  });
  const s = B.synthesis;
  svg.innerHTML = spokes + pulses + nodes + `
    <g class="node" tabindex="0" role="button" data-id="${s.id}" aria-label="合成報告">
      <circle class="body" cx="${C.x}" cy="${C.y}" r="62" fill="var(--hub)"/>
      <text class="nm" x="${C.x}" y="${C.y - 4}" text-anchor="middle" fill="var(--hub-ink)" style="font-size:20px">合成報告</text>
      <text class="meta" x="${C.x}" y="${C.y + 16}" text-anchor="middle" fill="var(--hub-ink)" style="font-size:11.5px">${esc(s.metric || "")}</text>
    </g>`;
  svg.querySelectorAll(".node").forEach(g => {
    g.addEventListener("click", () => openReport(g.dataset.id));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openReport(g.dataset.id); } });
  });
  $("#legend").innerHTML = Object.entries(EV).map(([k, c]) =>
    `<span><i style="background:${k === "參考" ? "transparent" : c};border:2px ${k === "參考" ? "dashed" : "solid"} ${c}"></i>${k}：${EV_TXT[k]}</span>`).join("");
}

/* ---------- 每日排行 ---------- */
function renderRank() {
  $("#rank").innerHTML = B.themes.map(t => {
    const d = t.delta == null ? "" : `<span class="${t.delta >= 0 ? "up" : "down"}">${t.delta >= 0 ? "▲" : "▼"}${Math.abs(t.delta).toFixed(0)}</span>`;
    return `<button class="item" data-id="${t.id}">
      <span class="no">${t.rank}</span>
      <span class="t">${esc(t.name)}</span>
      <span class="sc">${t.score.toFixed(0)}<small>合成分數 ${d}</small></span>
      <span class="bar"><i style="width:${Math.max(2, t.score)}%"></i></span>
      <span class="cos">${t.companies.map(c => esc(c)).join("・")}</span>
    </button>`;
  }).join("");
  $("#rank").querySelectorAll(".item").forEach(b => b.onclick = () => openReport(b.dataset.id));
  $("#rankSub").textContent = `${B.date}・從 ${B.n_themes} 個題材裡挑合成分數最高的 5 個，每篇都會拆到題材裡的公司。▲▼ 是和上個月比的分數變化。`;
  $("#method").innerHTML = B.method ? esc(B.method) : "";
}

/* ---------- 閱讀器 ---------- */
let lastFocus = null;
async function openReport(id) {
  const i = ORDER.findIndex(x => x.id === id); if (i < 0) return;
  openIdx = i; const r = ORDER[i];
  lastFocus = document.activeElement;
  $("#reader").classList.add("open"); $("#reader").setAttribute("aria-hidden", "false");
  $("#readerTitle").textContent = r.name || r.title || "";
  $("#doc").innerHTML = `<p class="sub">載入中…</p>`;
  $("#prev").disabled = i === 0; $("#next").disabled = i === ORDER.length - 1;
  history.replaceState(null, "", `?d=${B.date}&r=${id}`);
  try {
    const md = await (await fetch(r.file, { cache: "no-cache" })).text();
    $("#doc").innerHTML = marked.parse(md);
  } catch (e) { $("#doc").innerHTML = `<p>報告載入失敗：${esc(e.message)}</p>`; }
  $("#doc").scrollTop = 0;
  $("#reader [data-close]").focus({ preventScroll: true });
}
function closeReader() {
  $("#reader").classList.remove("open"); $("#reader").setAttribute("aria-hidden", "true");
  history.replaceState(null, "", "?d=" + B.date);
  lastFocus?.focus?.();
}
document.querySelectorAll("[data-close]").forEach(el => el.onclick = closeReader);
$("#prev").onclick = () => openIdx > 0 && openReport(ORDER[openIdx - 1].id);
$("#next").onclick = () => openIdx < ORDER.length - 1 && openReport(ORDER[openIdx + 1].id);
addEventListener("keydown", e => {
  if (!$("#reader").classList.contains("open")) return;
  if (e.key === "Escape") closeReader();
  if (e.key === "ArrowRight") $("#next").click();
  if (e.key === "ArrowLeft") $("#prev").click();
});

boot().catch(e => $(".wrap").insertAdjacentHTML("beforeend", `<p class="sub">資料載入失敗：${esc(e.message)}</p>`));
</script>
</body>
</html>
