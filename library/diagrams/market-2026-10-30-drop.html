<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10/30 下跌原因</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* 配色：diagram-design 設定檔 taiwan-analysis（取自網站 radar/site_library.html） */
    :root {
      --paper: #0e0c0a; --node: #191512; --ink: #f2ebe3; --muted: #c2b3a3; --soft: #9c8c7c;
      --rule: rgba(242,235,227,0.12); --accent: #f0a050; --accent-tint: rgba(240,160,80,0.12);
      --soft-tint: rgba(194,179,163,0.20); --link: #f7c873;
      --font-sans: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 20px 16px 24px; }
    .frame { max-width: 1000px; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem); font-weight: 400; line-height: 1.2; margin-bottom: 14px; }
    svg { width: 100%; min-width: 1480px; display: block; }
    .note { font-size: 13px; line-height: 1.75; color: var(--muted); margin-top: 12px; max-width: 900px; }
    .note b { color: var(--ink); font-weight: 600; }
    svg .bg { fill: var(--paper); }
    svg .grid { stroke: var(--ink); stroke-opacity: 0.08; stroke-width: 0.8; }
    svg .axis { stroke: var(--ink); stroke-opacity: 0.20; stroke-width: 1; }
    svg .ref { stroke: var(--link); stroke-width: 1; stroke-dasharray: 4,3; }
    svg .pt { fill: var(--soft-tint); stroke: var(--muted); stroke-width: 1; }
    svg .pt.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    svg .t-tick { fill: var(--muted); font: 400 11px var(--font-mono); }
    svg .t-axis { fill: var(--muted); font: 500 12px var(--font-sans); }
    svg .t-ref { fill: var(--link); font: 500 11px var(--font-sans); }
    svg .t-lab { fill: var(--ink); font: 500 11px var(--font-sans); }
    svg .t-sub { fill: var(--muted); font: 400 12px var(--font-sans); }
    svg a.node { cursor: pointer; }
    svg a.node:hover .pt, svg a.node:focus-visible .pt { stroke-width: 2; }
    svg a.node:hover .t-lab { fill: var(--link); text-decoration: underline; }
    svg .spine { stroke: var(--ink); stroke-width: 1.2; }
    svg .bone { stroke: var(--muted); stroke-width: 1; }
    svg .bone.focal { stroke: var(--accent); stroke-width: 1.2; }
    svg .tick { stroke: var(--soft); stroke-width: 1; }
    svg .cat { fill: var(--node); stroke: var(--muted); stroke-width: 1; }
    svg .cat.focal, svg .effect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    svg .t-cat { fill: var(--ink); font: 600 13px var(--font-sans); }
    svg .t-cat.focal { fill: var(--accent); }
    svg .t-eff { fill: var(--ink); font: 600 18px var(--font-sans); }
    svg .co a tspan { fill: var(--link); text-decoration: underline; text-decoration-color: rgba(247,200,115,0.35); }
    svg .co a:hover tspan { text-decoration-color: currentColor; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">盤勢與總經・2026-10-30</p>
    <h1>10/30 下跌：美國雲端財報點火，外資賣超放大</h1>
    <div class="diagram-container">
      <svg viewBox="-40 0 1480 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mkt-drop-20261030-title mkt-drop-20261030-desc">
        <title id="mkt-drop-20261030-title">10/30 台股下跌的原因</title>
        <desc id="mkt-drop-20261030-desc">2026-10-30 加權指數下跌 2.49% 的五類原因：美國科技財報引發 AI 投資回收疑慮為主因，外資賣超與新台幣走貶、利率與通膨、台廠財報、亞股與夜盤連動為其他因素。</desc>
        <defs>
          <marker id="mkt-drop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
        </defs>
        <rect class="bg" x="-40" y="0" width="1480" height="600"/>
        <line class="spine" x1="80" y1="320" x2="1196" y2="320" marker-end="url(#mkt-drop-arrow)"/>
        <line class="bone focal" x1="880" y1="320" x2="784" y2="152"/>
        <line class="bone" x1="720" y1="320" x2="624" y2="488"/>
        <line class="bone" x1="560" y1="320" x2="464" y2="152"/>
        <line class="bone" x1="400" y1="320" x2="304" y2="488"/>
        <line class="bone" x1="240" y1="320" x2="144" y2="152"/>
        <line class="tick" x1="848" y1="264" x2="816" y2="264"/>
        <text class="t-sub" x="812" y="260" text-anchor="end">Alphabet 單日 −12.6%</text>
        <line class="tick" x1="816" y1="208" x2="784" y2="208"/>
        <text class="t-sub" x="780" y="204" text-anchor="end">Amazon 現金流轉負</text>
        <line class="tick" x1="688" y1="376" x2="656" y2="376"/>
        <text class="t-sub" x="652" y="388" text-anchor="end">外資賣超 1,125 億</text>
        <line class="tick" x1="656" y1="432" x2="624" y2="432"/>
        <text class="t-sub" x="620" y="444" text-anchor="end">台幣 10 月貶 1.9%</text>
        <line class="tick" x1="528" y1="264" x2="496" y2="264"/>
        <text class="t-sub" x="492" y="260" text-anchor="end">12 月升息機率約 75%</text>
        <line class="tick" x1="496" y1="208" x2="464" y2="208"/>
        <text class="t-sub" x="460" y="204" text-anchor="end">9 月 CPI 年增 3.7%</text>
        <line class="tick" x1="368" y1="376" x2="336" y2="376"/>
        <text class="t-sub co" x="332" y="388" text-anchor="end"><a href="https://tw.stock.yahoo.com/quote/2308" target="_blank" rel="noopener"><tspan>2308 台達電</tspan></a><tspan> 跌停</tspan></text>
        <line class="tick" x1="336" y1="432" x2="304" y2="432"/>
        <text class="t-sub co" x="300" y="444" text-anchor="end"><a href="https://tw.stock.yahoo.com/quote/2409" target="_blank" rel="noopener"><tspan>2409 友達</tspan></a><tspan> 跌停</tspan></text>
        <line class="tick" x1="208" y1="264" x2="176" y2="264"/>
        <text class="t-sub" x="172" y="260" text-anchor="end">KOSPI −3.48%</text>
        <line class="tick" x1="176" y1="208" x2="144" y2="208"/>
        <text class="t-sub" x="140" y="204" text-anchor="end">台指期夜盤 −1.40%</text>
        <rect class="bg" x="724" y="124" width="120" height="28" rx="4"/>
        <rect class="cat focal" x="724" y="124" width="120" height="28" rx="4"/>
        <text class="t-cat focal" x="784" y="143" text-anchor="middle">美國科技財報</text>
        <rect class="bg" x="564" y="488" width="120" height="28" rx="4"/>
        <rect class="cat" x="564" y="488" width="120" height="28" rx="4"/>
        <text class="t-cat" x="624" y="507" text-anchor="middle">外資與新台幣</text>
        <rect class="bg" x="404" y="124" width="120" height="28" rx="4"/>
        <rect class="cat" x="404" y="124" width="120" height="28" rx="4"/>
        <text class="t-cat" x="464" y="143" text-anchor="middle">利率與通膨</text>
        <rect class="bg" x="244" y="488" width="120" height="28" rx="4"/>
        <rect class="cat" x="244" y="488" width="120" height="28" rx="4"/>
        <text class="t-cat" x="304" y="507" text-anchor="middle">台廠財報</text>
        <rect class="bg" x="84" y="124" width="120" height="28" rx="4"/>
        <rect class="cat" x="84" y="124" width="120" height="28" rx="4"/>
        <text class="t-cat" x="144" y="143" text-anchor="middle">亞股與夜盤</text>
        <rect class="bg" x="1200" y="276" width="200" height="88" rx="6"/>
        <rect class="effect" x="1200" y="276" width="200" height="88" rx="6"/>
        <text class="t-eff" x="1216" y="306">加權 −2.49%</text>
        <text class="t-sub" x="1216" y="330">收 45,212，跌 1,156.5 點</text>
        <text class="t-sub" x="1216" y="350">下跌 956 家、上漲 98 家</text>
        <line x1="0" y1="548" x2="1400" y2="548" stroke="var(--rule)" stroke-width="0.8"/>
        <rect x="0" y="564" width="16" height="12" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
        <text class="t-sub" x="24" y="574">焦點：主因（美國雲端業者 AI 支出回收疑慮）與結果</text>
        <rect x="420" y="564" width="16" height="12" rx="2" fill="var(--node)" stroke="var(--muted)" stroke-width="1"/>
        <text class="t-sub" x="444" y="574">其他原因</text>
        <text class="t-sub" x="1400" y="574" text-anchor="end">資料：證交所、中央銀行、BLS、CME FedWatch（2026-10-30 前）</text>
      </svg>
    </div>
    <p class="note"><b>怎麼讀：</b>右邊是結果，五根斜骨是原因，橘色那根是主因：Alphabet、Amazon 財報讓市場懷疑 AI 資本支出的回收速度（10/29 Alphabet 單日跌 12.6%）。外資當天賣超 1,124.67 億元，是史上第 7 大；台達電因第三季毛利率 34.08% 與存貨跌價損失約 39 億元跌停。數字來源見報告「資料與方法」；連結文字連到個股報價。</p>
  </div>
</body>
</html>
