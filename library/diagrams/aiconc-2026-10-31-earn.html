<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市值和盈餘占比</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* 配色：diagram-design 設定檔 taiwan-analysis（取自網站 radar/site_library.html） */
    :root {
      --paper: #0e0c0a; --node: #191512; --ink: #f2ebe3; --muted: #c2b3a3; --soft: #9c8c7c;
      --rule: rgba(242,235,227,0.12); --accent: #f0a050; --accent-tint: rgba(240,160,80,0.12);
      --soft-tint: rgba(194,179,163,0.20); --link: #f7c873;
      --font-sans: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 20px 16px 24px; }
    .frame { max-width: 1000px; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem); font-weight: 400; line-height: 1.2; margin-bottom: 14px; }
    svg { width: 100%; min-width: 960px; display: block; }
    .note { font-size: 13px; line-height: 1.75; color: var(--muted); margin-top: 12px; max-width: 900px; }
    .note b { color: var(--ink); font-weight: 600; }
    svg .bg { fill: var(--paper); }
    svg .grid { stroke: var(--ink); stroke-opacity: 0.08; stroke-width: 0.8; }
    svg .axis { stroke: var(--ink); stroke-opacity: 0.20; stroke-width: 1; }
    svg .ref { stroke: var(--link); stroke-width: 1; stroke-dasharray: 4,3; }
    svg .pt { fill: var(--soft-tint); stroke: var(--muted); stroke-width: 1; }
    svg .pt.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    svg .t-tick { fill: var(--muted); font: 400 11px var(--font-mono); }
    svg .t-axis { fill: var(--muted); font: 500 12px var(--font-sans); }
    svg .t-ref { fill: var(--link); font: 500 11px var(--font-sans); }
    svg .t-lab { fill: var(--ink); font: 500 11px var(--font-sans); }
    svg .t-sub { fill: var(--muted); font: 400 12px var(--font-sans); }
    svg a.node { cursor: pointer; }
    svg a.node:hover .pt, svg a.node:focus-visible .pt { stroke-width: 2; }
    svg a.node:hover .t-lab { fill: var(--link); text-decoration: underline; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
      svg .ln { fill: none; stroke-width: 1.6; }
    svg .t-end { font: 600 11px var(--font-sans); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">研究・2026-10-31</p>
    <h1>這次集中，盈餘也跟著集中</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 462" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aic2-t aic2-d">
        <title id="aic2-t">市值占比和盈餘占比</title>
        <desc id="aic2-d">1990 年金融股市值占 37% 但盈餘只占 15%；2000 年半導體市值 27%、盈餘 11%；2026 年電子股市值 80%、盈餘 70%，台積電 38% 對 38%。</desc>
        <rect class="bg" width="100%" height="100%"/>
        <line class="grid" x1="200.0" y1="30" x2="200.0" y2="392"/>
        <text class="t-tick" x="200.0" y="408" text-anchor="middle">0%</text>
        <line class="grid" x1="337.8" y1="30" x2="337.8" y2="392"/>
        <text class="t-tick" x="337.8" y="408" text-anchor="middle">20%</text>
        <line class="grid" x1="475.6" y1="30" x2="475.6" y2="392"/>
        <text class="t-tick" x="475.6" y="408" text-anchor="middle">40%</text>
        <line class="grid" x1="613.3" y1="30" x2="613.3" y2="392"/>
        <text class="t-tick" x="613.3" y="408" text-anchor="middle">60%</text>
        <line class="grid" x1="751.1" y1="30" x2="751.1" y2="392"/>
        <text class="t-tick" x="751.1" y="408" text-anchor="middle">80%</text>
        <text class="t-tick" x="890" y="26" text-anchor="middle">本益比</text>
        <text class="t-lab" x="186" y="54" text-anchor="end">1990-02 金融股</text>
        <line x1="303.3" y1="50" x2="454.9" y2="50" stroke="var(--muted)" stroke-width="2"/>
        <circle cx="303.3" cy="50" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/>
        <circle cx="454.9" cy="50" r="6" fill="var(--muted)"/>
        <text class="t-tick" x="464.9" y="54">37%</text>
        <text class="t-tick" x="293.3" y="54" text-anchor="end">15%</text>
        <text class="t-lab" x="890" y="54" text-anchor="middle">190</text>
        <text class="t-lab" x="186" y="98" text-anchor="end">2000-02 電子股</text>
        <line x1="441.1" y1="94" x2="572.0" y2="94" stroke="var(--muted)" stroke-width="2"/>
        <circle cx="441.1" cy="94" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/>
        <circle cx="572.0" cy="94" r="6" fill="var(--muted)"/>
        <text class="t-tick" x="582.0" y="98">54%</text>
        <text class="t-tick" x="431.1" y="98" text-anchor="end">35%</text>
        <text class="t-lab" x="890" y="98" text-anchor="middle">66</text>
        <text class="t-lab" x="186" y="142" text-anchor="end">2000-02 半導體</text>
        <line x1="275.8" y1="138" x2="386.0" y2="138" stroke="var(--muted)" stroke-width="2"/>
        <circle cx="275.8" cy="138" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/>
        <circle cx="386.0" cy="138" r="6" fill="var(--muted)"/>
        <text class="t-tick" x="396.0" y="142">27%</text>
        <text class="t-tick" x="265.8" y="142" text-anchor="end">11%</text>
        <text class="t-lab" x="890" y="142" text-anchor="middle">107</text>
        <text class="t-lab" x="186" y="186" text-anchor="end">2007-10 電子股</text>
        <line x1="578.9" y1="182" x2="599.6" y2="182" stroke="var(--muted)" stroke-width="2"/>
        <circle cx="578.9" cy="182" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/>
        <circle cx="599.6" cy="182" r="6" fill="var(--muted)"/>
        <text class="t-tick" x="609.6" y="174">58%</text>

        <text class="t-lab" x="890" y="186" text-anchor="middle">20</text>
        <text class="t-lab" x="186" y="230" text-anchor="end">2021-12 半導體</text>
        <line x1="379.1" y1="226" x2="475.6" y2="226" stroke="var(--muted)" stroke-width="2"/>
        <circle cx="379.1" cy="226" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/>
        <circle cx="475.6" cy="226" r="6" fill="var(--muted)"/>
        <text class="t-tick" x="485.6" y="230">40%</text>
        <text class="t-tick" x="369.1" y="230" text-anchor="end">26%</text>
        <text class="t-lab" x="890" y="230" text-anchor="middle">25</text>
        <text class="t-lab" x="186" y="274" text-anchor="end">2026-09 電子股</text>
        <line x1="682.2" y1="270" x2="751.1" y2="270" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="682.2" cy="270" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/>
        <circle cx="751.1" cy="270" r="6" fill="var(--accent)"/>
        <text class="t-tick" x="761.1" y="274">80%</text>
        <text class="t-tick" x="672.2" y="274" text-anchor="end">70%</text>
        <text class="t-lab" x="890" y="274" text-anchor="middle">38</text>
        <text class="t-lab" x="186" y="318" text-anchor="end">2026-09 半導體</text>
        <line x1="523.8" y1="314" x2="572.0" y2="314" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="523.8" cy="314" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/>
        <circle cx="572.0" cy="314" r="6" fill="var(--accent)"/>
        <text class="t-tick" x="582.0" y="318">54%</text>
        <text class="t-tick" x="513.8" y="318" text-anchor="end">47%</text>
        <text class="t-lab" x="890" y="318" text-anchor="middle">38</text>
        <text class="t-lab" x="186" y="362" text-anchor="end">2026-09 台積電</text>
        <line x1="461.8" y1="358" x2="461.8" y2="358" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="461.8" cy="358" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/>
        <circle cx="461.8" cy="358" r="6" fill="var(--accent)"/>
        <text class="t-tick" x="471.8" y="350">38%</text>

        <text class="t-lab" x="890" y="362" text-anchor="middle">33</text>
        <line x1="40" y1="424" x2="920" y2="424" stroke="var(--rule)" stroke-width="0.8"/>
        <circle cx="48" cy="442" r="6" fill="var(--muted)"/><text class="t-sub" x="60" y="446">市值占全市場</text>
        <circle cx="200" cy="442" r="5" fill="var(--paper)" stroke="var(--muted)" stroke-width="1.4"/><text class="t-sub" x="212" y="446">盈餘占全市場（近四季，虧損算 0）</text>
        <text class="t-sub" x="920" y="446" text-anchor="end">線越長＝股價跑得比獲利越前面</text>
      </svg>
    </div>
    <p class="note"><b>怎麼讀：</b>實心點是族群市值占全市場比重，空心點是族群近四季盈餘占全市場比重；兩點距離越遠，代表市值集中跑在獲利前面。盈餘＝市值÷本益比（TEJ），虧損公司盈餘算 0。歷次泡沫頂的特徵是市值遠多於盈餘；這次集中的程度最高，但台積電的市值占比和盈餘占比一樣。</p>
  </div>
</body>
</html>
