  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* 配色：diagram-design 設定檔 taiwan-analysis（取自網站 radar/site_library.html） */
    :root {
      --paper: #f4f5f2; --node: #ffffff; --ink: #12170f; --muted: #4c5549; --soft: #5f685c;
      --rule: rgba(18,23,15,0.12); --accent: #0f5c3c; --accent-tint: rgba(15,92,60,0.08);
      --font-sans: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0c0f0b; --node: #141913; --ink: #eaf1e6; --muted: #a7b3a2; --soft: #8a9686;
        --rule: rgba(234,241,230,0.12); --accent: #5cc999; --accent-tint: rgba(92,201,153,0.10);
      }
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 20px 16px 24px; }
    .frame { max-width: 1000px; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem); font-weight: 400; line-height: 1.2; margin-bottom: 14px; }
    svg { width: 100%; min-width: 960px; display: block; }
    .note { font-size: 13px; line-height: 1.75; color: var(--muted); margin-top: 12px; max-width: 900px; }
    .note b { color: var(--ink); font-weight: 600; }

    svg .bg { fill: var(--paper); }
    svg .wire { fill: none; stroke: var(--muted); stroke-width: 1; }
    svg .box { fill: var(--node); stroke: var(--ink); stroke-width: 1; }
    svg .box.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    svg .tag { fill: none; stroke: var(--soft); stroke-width: 0.8; }
    svg .tag.focal { stroke: var(--accent); }
    svg .t-tag { fill: var(--ink); font: 500 12px var(--font-sans); }
    svg .t-tag.focal { fill: var(--accent); }
    svg .t-name { fill: var(--ink); font: 600 13px var(--font-sans); }
    svg .t-root { fill: var(--ink); font: 600 16px var(--font-sans); }
    svg .t-sub { fill: var(--muted); font: 400 12px var(--font-sans); }
    svg .t-co { fill: var(--ink); font: 600 12px var(--font-sans); }
    svg .t-col { fill: var(--muted); font: 500 12px var(--font-sans); }
    svg .sep { stroke: var(--rule); stroke-width: 0.8; }
    svg a.node { cursor: pointer; }
    svg a.node:hover .box, svg a.node:focus-visible .box { stroke-width: 2; }
    svg a.node:focus-visible { outline: none; }
    svg .t-go { fill: var(--muted); font: 400 12px var(--font-sans); }
    svg a.node:hover .t-go { fill: var(--ink); }
    svg .co a tspan { fill: var(--link); text-decoration: underline; text-decoration-color: rgba(31,99,184,0.35); }
    svg .co a:hover tspan { text-decoration-color: currentColor; }
    @media (prefers-color-scheme: dark) { svg .co a tspan { text-decoration-color: rgba(106,166,238,0.4); } }
    :root { --link: #1f63b8; }
    @media (prefers-color-scheme: dark) { :root { --link: #6aa6ee; } }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  
    /* 啞鈴圖 */
    :root { --axis: rgba(18,23,15,0.25); --conn: rgba(18,23,15,0.55); --grid: rgba(18,23,15,0.08); }
    @media (prefers-color-scheme: dark) { :root { --axis: rgba(234,241,230,0.20); --conn: rgba(234,241,230,0.40); --grid: rgba(234,241,230,0.08); } }
    svg { min-width: 800px; }
    svg .grid { stroke: var(--grid); stroke-width: 0.8; }
    svg .axis { stroke: var(--axis); stroke-width: 1; }
    svg .conn { stroke: var(--conn); stroke-width: 1; }
    svg .ref { fill: var(--paper); stroke: var(--muted); stroke-width: 1.5; }
    svg .focal { fill: var(--accent); stroke: var(--ink); stroke-width: 1; }
    svg .rowname { fill: var(--ink); font: 600 13px var(--font-sans); }
    svg a.lk .rowname { fill: var(--link); text-decoration: underline; text-decoration-color: rgba(31,99,184,0.35); }
    svg a.lk:hover .rowname { text-decoration-color: currentColor; }
    svg .rown { fill: var(--muted); font: 400 12px var(--font-sans); }
    svg .tick { fill: var(--muted); font: 400 12px var(--font-sans); }
    svg .axis-title { fill: var(--muted); font: 500 12px var(--font-sans); }
    svg .val { fill: var(--muted); font: 500 12px var(--font-sans); }
    svg .focal-val { fill: var(--accent); font-weight: 600; }
    svg .key { fill: var(--ink); font: 400 12px var(--font-sans); }
  </style>
</head>

    <p class="note"><b>怎麼讀：</b>兩個點在同一把尺上，距離就是「訊息有多少耗在開盤跳空、多少留到開盤之後」。
