  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {

    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 20px 16px 24px; }

    svg { width: 100%; min-width: 960px; display: block; }
    .note { font-size: 13px; line-height: 1.75; color: var(--muted); margin-top: 12px; max-width: 900px; }
    .note b { color: var(--ink); font-weight: 600; }

    svg .bg { fill: var(--paper); }
    svg .wire { fill: none; stroke: var(--muted); stroke-width: 1; }
    svg .box { fill: var(--node); stroke: var(--ink); stroke-width: 1; }
    svg .box.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    svg .box.risk { stroke-dasharray: 5,4; }
    svg .tag { fill: none; stroke: var(--soft); stroke-width: 0.8; }
    svg .tag.focal { stroke: var(--accent); }
    svg .t-tag { fill: var(--ink); font: 500 12px var(--font-sans); }
    svg .t-tag.focal { fill: var(--accent); }
    svg .t-name { fill: var(--ink); font: 600 13px var(--font-sans); }
    svg .t-root { fill: var(--ink); font: 600 16px var(--font-sans); }
    svg .t-sub { fill: var(--muted); font: 400 12px var(--font-sans); }
    svg .t-co { fill: var(--ink); font: 600 12px var(--font-sans); }
    svg .t-col { fill: var(--muted); font: 500 12px var(--font-sans); }
    svg a.node { cursor: pointer; }
    svg a.node:hover .box, svg a.node:focus-visible .box { stroke-width: 2; }
    svg a.node:focus-visible { outline: none; }
    svg .co a tspan { fill: var(--link); text-decoration: underline; text-decoration-color: rgba(247,200,115,0.35); }
    svg .co a:hover tspan { text-decoration-color: currentColor; }
    @media (prefers-color-scheme: dark) { svg .co a tspan { text-decoration-color: rgba(247,200,115,0.4); } }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>

    <p class="note"><b>怎麼讀：</b>十銓向原廠買 DRAM 顆粒與 NAND 晶圓、做成模組與 SSD 賣出，毛利率取決於「進貨成本和賣價的時間差」。2025 年底起合約價連漲，十銓存貨從 44 億元堆到 172 億元，第三季毛利率升到 49.3%（公司財報，2026-10-28）。第四季 DRAM 合約價仍漲但漲幅收斂，NAND 晶圓現貨已先轉跌（TrendForce，2026-10-28）；同一批存貨在價格反轉時會變成跌價損失。客戶與同業名單取自 MoneyDJ，上游採購比重取自 2026-04-28 法說報導。</p>
