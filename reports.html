<meta name="description" content="台股分析的所有報告：盤勢與總經、每日日報、個股報告、估值、供應鏈深挖、題材卷宗、研究與回測。">
<style>
:root {
  color-scheme: dark;
  --bg: #0e0c0a; --panel: #191512; --line: #2d2620; --grid: #3a3129; --ink: #f2ebe3; --ink-2: #c2b3a3; --ink-3: #8c7d6e; --ev-1: #ffcf8a; --ev-2: #f0a050; --ev-3: #c97a3a; --ev-4: #5b4b3d; --accent: #f5b461; --tag-auto: #2e2116; --tag-ask: #33201c; --tag-in: #2b2617; --up: #ff7a5c; --down: #8fb4cc;
  /* 關聯圖：報告類別的顏色（每天自動的類別共用 --c-auto） */
  --c-industry: #f5b461; --c-company: #ff7a5c; --c-themechain: #ffd59a; --c-research: #8fb4cc; --c-market: #c9a0dc; --c-ledger: #e58fb0; --c-movers: #d9c3a5; --c-auto: #7d6d5f;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f1e8; --panel: #fffaf3; --line: #e6dccd; --grid: #d8ccb9; --ink: #1f1812; --ink-2: #5c4f43; --ink-3: #8a7b6c; --ev-1: #a8521b; --ev-2: #c9702e; --ev-3: #dc9a5c; --ev-4: #c4b5a3; --accent: #b5541c; --tag-auto: #f6e6d3; --tag-ask: #f7e0da; --tag-in: #f6efe0; --up: #c8432a; --down: #3f6f8f;
  --c-industry: #b5541c; --c-company: #c8432a; --c-themechain: #b8860b; --c-research: #3f6f8f; --c-market: #7d4fa0; --c-ledger: #b0476f; --c-movers: #8a6d4b; --c-auto: #a89886;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 22px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px; }
h1 { font-size: 24px; margin: 0; line-height: 1.25; }
header nav { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
header nav a { text-decoration: none; }
input, button { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
.sub { color: var(--ink-3); font-size: 13px; margin: 8px 0 0; }
.hide { display: none !important; }

/* 今日大盤（最新盤前預估） */
.hero { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; }
.hero .hhd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
.hero .hhd h2 { font-size: 20px; }
.hero .hhd .when { color: var(--ink-3); font-size: 13px; }
.hero .hhd a { margin-left: auto; font-size: 14px; font-weight: 600; text-decoration: none; }
.hero .hbody { display: grid; grid-template-columns: 200px 1fr 300px; gap: 18px 32px; align-items: start; }
@media (max-width: 900px) { .hero .hbody { grid-template-columns: 1fr 1fr; } .hero .track { grid-column: 1 / -1; } }
@media (max-width: 560px) { .hero .hbody { grid-template-columns: 1fr; } .hero { padding: 16px; } }
.hero .lbl { color: var(--ink-3); font-size: 12.5px; }
.hero .pct { font-size: 56px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
.hero .verdict { font-size: 15px; font-weight: 700; margin-top: 2px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink); }
.hero .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 2px 0 14px; }
.hero .kv span:nth-child(odd) { color: var(--ink-3); font-size: 12.5px; padding-top: 1px; }
.hero .kv b { font-variant-numeric: tabular-nums; }
.scen { display: flex; height: 26px; border-radius: 6px; overflow: hidden; font-size: 11.5px; font-weight: 600; }
.scen div { display: flex; align-items: center; justify-content: center; min-width: 0; white-space: nowrap; overflow: hidden; color: #1a1410; }
.scen-lg { color: var(--ink-3); font-size: 11.5px; margin-top: 4px; }
.track h3 { font-size: 13px; color: var(--ink-2); margin: 0 0 4px; font-weight: 600; }
.track .tr { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 44px 1fr 1fr 20px; gap: 8px; width: 100%;
             padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; font-variant-numeric: tabular-nums; }
.track .tr:hover { color: var(--accent); }
.track .tr .d { color: var(--ink-3); }
.track .ok { color: var(--accent); } .track .ng { color: var(--ink-3); }
.track .acc { color: var(--ink-3); font-size: 12px; margin-top: 8px; }

/* 搜尋＋區塊捷徑：捲動時固定在上方 */
.toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
           padding: 12px 0; margin-top: 14px; border-bottom: 1px solid var(--line); }
#q { width: min(340px, 100%); }
.gnav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.gnav a { text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; }
.gnav a:hover { color: var(--accent); }
.gnav a small { font-weight: 400; color: var(--ink-3); margin-left: 3px; font-variant-numeric: tabular-nums; }

h2 { font-size: 15px; margin: 0; }
.sec-hd { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 8px; }
.sec-hd .note { color: var(--ink-3); font-size: 12.5px; }

/* 最近更新：每類只列最新一篇 */
.latest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; border-top: 1px solid var(--line); }
@media (max-width: 760px) { .latest { grid-template-columns: minmax(0, 1fr); } }
.row { all: unset; box-sizing: border-box; display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 8px 2px; border-bottom: 1px solid var(--line);
       cursor: pointer; font-size: 14px; min-width: 0; }
.row .dt { flex: none; width: 52px; white-space: nowrap; color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.row .ct { flex: none; width: 92px; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .sm { color: var(--ink-3); font-size: 12.5px; line-height: 1.55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sm.lead { color: var(--ink-2); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row.lead .tt { font-weight: 700; white-space: normal; }
.row:hover .tt, .row:focus-visible .tt { color: var(--accent); }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

/* 區塊：一個面板，裡面每個類別一列（左：說明，右：最新幾篇） */
.group { margin-top: 36px; scroll-margin-top: 70px; }
.group > .ghd { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.group > .ghd h2 { font-size: 20px; padding-left: 12px; border-left: 4px solid var(--ev-2); line-height: 1.3; }
.group > .ghd p { color: var(--ink-3); font-size: 13px; margin: 0; }
.group.method > .ghd h2 { border-left-color: var(--ev-4); font-size: 17px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 20px; }
.cat { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 6px 28px; padding: 16px 0; }
.cat + .cat { border-top: 1px solid var(--line); }
@media (max-width: 760px) { .cat { grid-template-columns: minmax(0, 1fr); } .panel { padding: 0 14px; } }
.cat h3 { font-size: 16px; margin: 0; }
.cat .how { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; color: var(--ink-2); }
.tag.auto { background: var(--tag-auto); } .tag.ask { background: var(--tag-ask); } .tag.in { background: var(--tag-in); }
.cat .desc { font-size: 12.5px; color: var(--ink-3); margin: 6px 0 0; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cat ul { list-style: none; margin: 0; padding: 0; }
.cat li .row { padding: 7px 2px; border-bottom: 1px dashed var(--line); }
.cat li:last-child .row { border-bottom: 0; }
.cat .more { all: unset; cursor: pointer; margin-top: 6px; font-size: 13px; color: var(--accent); }
.cat .more:hover { text-decoration: underline; }
.cat .empty { font-size: 13px; color: var(--ink-3); padding: 6px 0; }

/* 閱讀器 */
#reader { position: fixed; inset: 0; z-index: 20; display: none; }
#reader.open { display: block; }
#reader .shade { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#reader .sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(900px, 100%); background: var(--panel); border-left: 1px solid var(--line);
                 display: flex; flex-direction: column; animation: slide .25s ease-out; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
#reader .bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#reader .bar b { font-size: 14px; color: var(--ink-2); margin-right: auto; }
#doc { overflow: auto; padding: 8px 26px 40px; flex: 1; }
#doc.frame { padding: 0; }
#doc iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
#doc h1 { font-size: 24px; margin: 14px 0 4px; }
#doc h2 { font-size: 19px; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
#doc h3 { font-size: 16px; margin: 18px 0 6px; }
#doc p, #doc li { line-height: 1.8; }
#doc table { border-collapse: collapse; font-size: 13px; margin: 10px 0; display: block; overflow-x: auto; }
#doc th, #doc td { border-bottom: 1px solid var(--line); padding: 6px 9px; text-align: left; white-space: nowrap; }
#doc th { color: var(--ink-2); }
#doc blockquote { margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--ev-2); color: var(--ink-2); background: var(--bg); border-radius: 0 8px 8px 0; }
#doc code { font-size: 12.5px; background: var(--bg); padding: 1px 5px; border-radius: 5px; }
#doc pre { overflow-x: auto; background: var(--bg); padding: 10px; border-radius: 8px; }
@media (max-width: 640px) { #doc { padding: 6px 16px 40px; } }
footer { color: var(--ink-3); font-size: 12px; margin-top: 26px; }
@media (prefers-reduced-motion: reduce) { #reader .sheet { animation: none; } }
.owner { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; font-size: 12.5px; line-height: 1.5; }
.owner a { color: var(--ink-3); text-decoration: none; }
.owner a:hover { color: var(--ink); text-decoration: underline; }
.owner .gh { display: inline-flex; align-items: center; gap: 5px; }

/* 列表／關聯圖切換 */
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
.views button { border: 0; border-radius: 0; background: transparent; color: var(--ink-3); padding: 5px 14px; }
.views button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; }
.views button:focus-visible, .gchip:focus-visible, .grel:focus-visible, .gopen:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* 關聯圖：左圖右面板，窄螢幕上下 */
#graphSec { margin-top: 18px; }
.gnote { color: var(--ink-3); font-size: 12.5px; margin: 0 0 10px; }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.gchip { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 10px 3px 8px; font-size: 12.5px; color: var(--ink-2); background: transparent; }
.gchip b { font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.gchip[aria-pressed="false"] { opacity: .4; }
.gchip i, .gcat i, .grel i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.gwrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; }
#gstage { position: relative; min-width: 0; height: min(74vh, 760px); min-height: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
#gsvg { display: block; width: 100%; height: 100%; touch-action: none; }
.glk { stroke: var(--grid); stroke-opacity: .8; transition: opacity .3s ease; }
.glk.ln { stroke-dasharray: 5 3; }
/* 選到的報告：連線上的虛線從它往外流 */
.glk.on { stroke: var(--accent); stroke-opacity: .95; stroke-dasharray: 6 5; animation: gflow .9s linear infinite; }
.glk.on.rev { animation-direction: reverse; }
@keyframes gflow { to { stroke-dashoffset: -11; } }
.gnd { transition: opacity .3s ease; }
.glk.dim, .gnd.dim { opacity: .1; }
.gnd .dot { stroke: var(--panel); stroke-width: 1.5; cursor: pointer; transition: transform .18s ease; transform-box: fill-box; transform-origin: center; }
.gnd:hover .dot { transform: scale(1.3); }
.gnd.sel .dot { stroke: var(--ink); stroke-width: 2.5; }
.gnd .pulse { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; pointer-events: none; transform-box: fill-box; transform-origin: center; }
.gnd.sel .pulse { animation: gpulse 1.8s ease-out infinite; }
@keyframes gpulse { from { opacity: .75; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
.gnd text { font-size: 11.5px; fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; transition: opacity .25s ease; }
.gnd.sel text { fill: var(--ink); font-weight: 700; }
.ghint { position: absolute; left: 12px; right: 12px; bottom: 10px; font-size: 12px; color: var(--ink-3); pointer-events: none; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.ghint .fit { pointer-events: auto; margin-left: auto; font-size: 12px; padding: 3px 9px; }
#gpanel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; height: min(74vh, 760px); min-height: 420px; overflow: auto; }
.gcat { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.gtitle { font-size: 17px; line-height: 1.45; margin: 6px 0 0; text-wrap: balance; }
.gsum { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; line-height: 1.65; }
.gths { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.gths span { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--tag-in); color: var(--ink-2); }
.gopen { margin-top: 12px; background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
#gpanel h4 { font-size: 13px; color: var(--ink-2); margin: 20px 0 6px; }
#gpanel h4 small { color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.grels { list-style: none; margin: 0; padding: 0; }
.grel { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 9px minmax(0, 1fr); column-gap: 9px; width: 100%; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.grel i { margin-top: 7px; }
.grel .gt { font-size: 14px; }
.grel .gd, .grel .gw { grid-column: 2; font-size: 12px; color: var(--ink-3); line-height: 1.55; }
.grel .gw { color: var(--ink-2); }
.grel:hover .gt { color: var(--accent); }
/* 面板換篇時依序淡入 */
#gpanel > * { animation: gin .35s ease-out both; }
.grels li { animation: gin .35s ease-out both; animation-delay: calc(80ms + var(--i, 0) * 35ms); }
@keyframes gin { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) {
  .glk.on, .gnd.sel .pulse, #gpanel > *, .grels li { animation: none; }
  .glk, .gnd, .gnd .dot, .gnd text { transition: none; }
}
@media (max-width: 860px) {
  .gwrap { grid-template-columns: minmax(0, 1fr); }
  #gstage { height: 60vh; min-height: 340px; }
  #gpanel { height: auto; min-height: 0; }
}
</style>
</head>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋報告標題，例如：記憶體、玻璃基板、估值" aria-label="搜尋報告">
    <nav class="gnav" id="gnav" aria-label="報告區塊"></nav>
    <div class="views" role="group" aria-label="顯示方式">
      <button type="button" data-view="list" aria-pressed="true">列表</button>
      <button type="button" data-view="graph" aria-pressed="false">關聯圖</button>
    </div>
  </div>

  <section id="graphSec" class="hide" aria-label="報告關聯圖">
    <p class="gnote">每篇報告連到最相關的 5 篇：內文相近、提到同一批公司、談同樣題材，或內文直接互相連結（虛線）。很多報告都會提到的公司（像台積電）幾乎不加分。</p>
    <div class="gchips" id="gchips"></div>
    <div class="gwrap">
      <div id="gstage">
        <svg id="gsvg" role="img" aria-label="報告之間的關聯圖"></svg>
        <div class="ghint"><span>滾輪縮放・拖曳平移・點圓點看相關報告</span><button type="button" class="fit" id="gfit">重置視角</button></div>
      </div>
      <aside id="gpanel" aria-live="polite"></aside>
    </div>
  </section>

  <section id="latestSec">
    <div class="sec-hd"><h2>最近更新</h2></div>
    <div class="latest" id="latest"></div>
  </section>

  <div id="groups"></div>

  <footer>研究輔助，不是投資建議。</footer>
</div>

<div id="reader" aria-hidden="true">
  <div class="shade" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
    <div class="bar">
      <b id="readerTitle"></b>
      <a id="raw" target="_blank" rel="noopener">原始檔 ↗</a>
      <button data-close>✕ 關閉</button>
    </div>
    <article id="doc"></article>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TAG = { "每天自動": "auto", "每月自動": "auto", "每週更新": "auto", "不定期更新": "ask", "每天自動＋深挖": "ask" };
const SHOW = 4;
let CATS = [], ALL = [], GROUPS = [], HERO = null;

(function theme() {
  let t = null;
  try { t = localStorage.getItem("theme-warm"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $("#themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme !== "light";   // 預設黑底
    const n = dark ? "light" : "dark";
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem("theme-warm", n); } catch (e) {}
  };
})();

// 列表旁邊已經有日期欄，標題裡的「（2026-10-16）」「 2026-10-16」拿掉
const short = t => t.replace(/[（(]\s*\d{4}-\d{2}(?:-\d{2})?\s*[）)]/g, "").replace(/\s+\d{4}-\d{2}-\d{2}\s*$/, "").replace(/^\d{4}-\d{2}-\d{2}\s+/, "").trim() || t;
let YEAR = "";
const day = d => !d ? "—" : d.length === 10 && d.startsWith(YEAR) ? d.slice(5) : d;   // 今年的日期只寫月-日
// 標題都一樣（盤前預估、外資動向…）的類別，主文字改用報告裡抽出的一句話
function label(r, cat, dup) {
  let t = short(r.title);
  if (cat && t.startsWith(cat + "：")) t = t.slice(cat.length + 1);   // 類別裡不用再寫「題材鏈分析：」
  const generic = t === cat || (dup && dup[t] > 1);
  return { t, generic, main: generic && r.sum ? r.sum : t, sub: generic ? "" : r.sum || "" };
}
function row(r, withCat, cat, dup, lead) {
  const L = label(r, withCat ? r.cat : cat, dup);
  const ct = withCat ? `<span class="ct">${esc(r.cat)}</span>` : "";
  const sub = !withCat && L.sub ? `<span class="sm${lead ? " lead" : ""}">${esc(L.sub)}</span>` : "";
  return `<button class="row${lead ? " lead" : ""}" data-path="${esc(r.path)}" title="${esc(r.full || r.title)}"><span class="dt">${esc(day(r.date))}</span>${ct}<span class="tx"><span class="tt">${esc(L.main)}</span>${sub}</span></button>`;
}

const WD = "日一二三四五六";
const sgn = (x, d = 2) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const tone = p => p >= 60 ? "up" : p <= 40 ? "down" : "flat";
function hero(h) {
  if (!h) return;
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const when = `${h.date.slice(5).replace("-", "/")}（${WD[new Date(h.date + "T12:00:00Z").getUTCDay()]}）盤前預估` +
               (h.date === today ? "・今天 08:40 前發布" : "・最近一個交易日，下一份在下個交易日 08:40 前發布");
  const verdict = { up: "偏多：收紅機率較高", down: "偏空：收黑機率較高", flat: "方向不明：紅黑機率接近" }[tone(h.p_up)];
  const SC = { 大跌: "var(--down)", 小跌: "color-mix(in srgb, var(--down) 55%, var(--panel))", 小漲: "color-mix(in srgb, var(--up) 55%, var(--panel))", 大漲: "var(--up)" };
  const scen = (h.scen || []).length ? `<div class="lbl" style="margin-bottom:4px">四種情境的機率</div>
    <div class="scen" role="img" aria-label="${h.scen.map(([k, v]) => k + " " + v + "%").join("，")}">${h.scen.map(([k, v]) =>
      `<div style="flex:${Math.max(v, 0.5)};background:${SC[k]}" title="${k} ${v}%">${v >= 18 ? k + " " + v + "%" : v >= 8 ? v + "%" : ""}</div>`).join("")}</div>
    <div class="scen-lg">大跌 &lt;−1%、小跌 −1%～0、小漲 0～+1%、大漲 &gt;+1%</div>` : "";
  const kv = [h.exp != null && ["預期漲跌", `<b class="${h.exp > 0 ? "up" : h.exp < 0 ? "down" : ""}">${sgn(h.exp)}%</b>（約 ${sgn(h.pts, 0)} 點，昨收 ${h.prev.toLocaleString()}）`],
              h.lo != null && ["可能區間", `<b>${h.lo_pt.toLocaleString()} ～ ${h.hi_pt.toLocaleString()}</b>（${sgn(h.lo)}% ～ ${sgn(h.hi)}%，8 成機率落在這裡）`]]
             .filter(Boolean).map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join("");
  const track = (h.track || []).map(t => `<button class="tr" data-path="${esc(t.path)}"><span class="d">${esc(t.date.slice(5))}</span>
      <span>收紅 ${t.p_up}%</span><span class="${t.act == null ? "" : t.act > 0 ? "up" : "down"}">${t.act == null ? "等收盤" : "實際 " + sgn(t.act) + "%"}</span>
      <span class="${t.hit ? "ok" : "ng"}" title="${t.hit == null ? "" : t.hit ? "猜對方向" : "猜錯方向"}">${t.hit == null ? "" : t.hit ? "✓" : "✗"}</span></button>`).join("");
  $("#hero").innerHTML = `<div class="hhd"><h2 id="heroTitle">今日大盤</h2><span class="when">${esc(when)}</span>
      <a href="#" data-path="${esc(h.path)}">看完整預估與依據 →</a></div>
    <div class="hbody">
      <div><div class="lbl">加權指數收紅機率</div><div class="pct ${tone(h.p_up)}">${h.p_up}%</div><div class="verdict ${tone(h.p_up)}">${verdict}</div></div>
      <div><div class="kv">${kv}</div>${scen}</div>
      <div class="track"><h3>最近幾天：預估 vs. 實際收盤</h3>${track}
        ${h.acc ? `<div class="acc">過去 8 年回測準確率 ${h.acc}%</div>` : ""}</div>
    </div>`;
  $("#hero").classList.remove("hide");
}

function render() {
  YEAR = ALL.map(r => r.date || "").sort().pop().slice(0, 4);
  const newest = CATS.filter(c => c.items.length && c.key !== "premarket").map(c => ({ ...c.items[0], cat: c.name }));
  $("#latest").innerHTML = newest.sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 10).map(r => row(r, true)).join("");
  const card = c => {
    const n = c.items.length;
    const dup = {};
    c.items.forEach(r => { const t = label(r, c.name).t; dup[t] = (dup[t] || 0) + 1; });
    const body = n ? `<ul>${c.items.map((r, i) => `<li data-t="${esc((r.title + " " + (r.full || "") + " " + (r.sum || "")).toLowerCase())}"${i >= SHOW ? ' data-x="1" class="hide"' : ""}>${row(r, false, c.name, dup, i === 0)}</li>`).join("")}</ul>
             ${n > SHOW ? `<button class="more">全部 ${n} 篇</button>` : ""}`
          : `<div class="empty">還沒有這類報告。</div>`;
    return `<section class="cat" data-key="${c.key}">
      <div><h3>${esc(c.name)}</h3>
        <div class="how"><span class="tag ${TAG[c.how] || "auto"}">${esc(c.how)}</span>　${n} 篇</div>
        <p class="desc">${esc(c.desc)}</p></div>
      <div>${body}</div></section>`;
  };
  const count = g => g.cats.reduce((a, c) => a + c.items.length, 0);
  $("#gnav").innerHTML = GROUPS.map(g => `<a href="#g-${g.key}">${esc(g.name)}<small>${count(g)}</small></a>`).join("");
  $("#groups").innerHTML = GROUPS.map(g => `<section class="group ${g.key}" id="g-${g.key}">
      <div class="ghd"><h2>${esc(g.name)}</h2><p>${esc(g.desc)}</p></div>
      <div class="panel">${g.cats.map(card).join("")}</div></section>`).join("");
}

document.addEventListener("click", e => {
  const m = e.target.closest(".more");
  if (m) {
    const box = m.closest(".cat"), open = m.dataset.open === "1";
    box.querySelectorAll("li[data-x]").forEach(x => x.classList.toggle("hide", open));
    m.dataset.open = open ? "" : "1";
    m.textContent = open ? m.textContent.replace("收合", "全部") : m.textContent.replace("全部", "收合");
    return;
  }
  const b = e.target.closest("[data-path]");
  if (b) { e.preventDefault(); openDoc(b.dataset.path); }
});

$("#q").addEventListener("input", () => {
  if (VIEW === "graph") { GS?.paint?.(); return; }      // 關聯圖：只把符合的報告標出來
  const q = $("#q").value.trim().toLowerCase();
  $("#latestSec").classList.toggle("hide", !!q);
  $("#hero").classList.toggle("hide", !!q || !HERO);
  document.querySelectorAll(".cat").forEach(c => {
    let hit = 0;
    c.querySelectorAll("li").forEach(x => {
      const ok = !q ? !x.dataset.x : x.dataset.t.includes(q);
      x.classList.toggle("hide", !ok); hit += ok;
    });
    const more = c.querySelector(".more"); if (more) more.classList.toggle("hide", !!q);
    c.classList.toggle("hide", !!q && !hit);
  });
  document.querySelectorAll(".group").forEach(g => g.classList.toggle("hide", !!q && !g.querySelector(".cat:not(.hide)")));
});

/* ---------- 閱讀器 ---------- */
let lastFocus = null;
// 報告內文的連結是寫報告時的相對路徑（themechain/x.md、chain-x.md…），網站上要換成 ?r=library/類別/檔名
const byFile = name => ALL.find(x => x.file === name || x.path.split("/").pop() === name);
function fixLinks(doc) {
  doc.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^(https?:|mailto:|#)/.test(href)) return;
    const q = href.match(/^\?r=([^#]+)/);
    const target = q ? decodeURIComponent(q[1]) : href.split("#")[0];
    const name = decodeURIComponent(target.split("/").pop() || "");
    const hit = ALL.find(x => x.path === target) || (/\.(md|html)$/.test(name) && byFile(name));
    if (hit) { a.setAttribute("href", "?r=" + encodeURIComponent(hit.path)); a.dataset.path = hit.path; }
    else if (/\.md$/.test(name)) {                        // 沒公開的工作檔（卷宗等）：拿掉連結，只留文字
      const sp = document.createElement("span"); sp.textContent = a.textContent; a.replaceWith(sp);
    }
  });
}

// 表格整理（顯示前）：格子裡緊貼文字的 |（絕對值 |x|、新聞標題）跳脫、分隔列欄數跟表頭一致、nan 顯示成 —
function tidyTables(md) {
  const L = md.split("\n"), sep = l => /^\|[\s:|-]+\|\s*$/.test(l);
  const cells = l => l.trim().slice(1, -1).replace(/(?<=\S)(?<!\\)\|(?=\S)|(?<=\S)(?<!\\)\|(?= )(?!\s*$)|(?<= )\|(?=\S)/g, "\\|")
                      .split(/(?<!\\)\|/).map(c => /^\s*[+-]?nan\s*$/i.test(c) ? " — " : c.replace(/NaN（/g, "（"));
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (!l.startsWith("|") || !l.trim().endsWith("|") || sep(l)) continue;
    const c = cells(l);
    L[i] = "|" + c.join("|") + "|";
    if (sep(L[i + 1] || "") && !(i > 0 && L[i - 1].startsWith("|"))) L[i + 1] = "|" + c.map(() => "---").join("|") + "|";
  }
  return L.join("\n");
}

async function openDoc(path) {
  const r = ALL.find(x => x.path === path) || byFile(decodeURIComponent(path.split("/").pop() || "")); if (!r) return;
  path = r.path;
  // 圖裡的連結會帶 #sec=段落開頭，開報告後捲到那一段
  const sec = decodeURIComponent((location.hash.match(/^#sec=(.+)$/) || [])[1] || "");
  lastFocus = document.activeElement;
  $("#reader").classList.add("open"); $("#reader").setAttribute("aria-hidden", "false");
  $("#readerTitle").textContent = r.title.startsWith(r.cat) ? r.title : r.cat + "｜" + r.title;
  $("#raw").href = r.path;
  history.replaceState(null, "", "?r=" + encodeURIComponent(path));
  const doc = $("#doc");
  if (r.kind === "html") {
    doc.className = "frame";
    doc.innerHTML = `<iframe src="${esc(r.path)}" title="${esc(r.title)}"></iframe>`;
  } else {
    doc.className = ""; doc.innerHTML = `<p class="sub">載入中…</p>`;
    try { doc.innerHTML = marked.parse(tidyTables(await (await fetch(r.path, { cache: "no-cache" })).text())); fixLinks(doc); }
    catch (e) { doc.innerHTML = `<p>報告載入失敗：${esc(e.message)}</p>`; }
    doc.scrollTop = 0;
    const hs = [...doc.querySelectorAll("h2, h3")];
    hs.forEach((h, i) => h.id = "s" + i);
    const hit = sec && hs.find(h => h.textContent.trim().startsWith(sec));
    if (hit) doc.scrollTop = hit.getBoundingClientRect().top - doc.getBoundingClientRect().top - 8;
  }
  $("#reader [data-close]").focus({ preventScroll: true });
}
function closeReader() {
  $("#reader").classList.remove("open"); $("#reader").setAttribute("aria-hidden", "true");
  $("#doc").innerHTML = "";
  history.replaceState(null, "", location.pathname + (VIEW === "graph" ? "#graph" : ""));
  lastFocus?.focus?.();
}
document.querySelectorAll("[data-close]").forEach(el => el.onclick = closeReader);
addEventListener("keydown", e => { if (e.key === "Escape" && $("#reader").classList.contains("open")) closeReader(); });

/* ---------- 關聯圖（radar/library.py relations() 寫的 data/report_graph.json） ---------- */
let VIEW = "list", GS = null;
const CC = k => `var(--c-${k}, var(--c-auto))`;
const clip = (s, n) => s.length > n ? s.slice(0, n) + "…" : s;
function setView(v) {
  VIEW = v;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  const g = v === "graph";
  $("#graphSec").classList.toggle("hide", !g);
  $("#gnav").classList.toggle("hide", g);
  if (g) { ["#groups", "#latestSec", "#hero"].forEach(s => $(s).classList.add("hide")); openGraph(); }
  else { $("#groups").classList.remove("hide"); $("#q").dispatchEvent(new Event("input")); }
  history.replaceState(null, "", location.pathname + location.search + (g ? "#graph" : ""));
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
const loadScript = src => new Promise((ok, no) => {
  const s = document.createElement("script");
  s.src = src; s.onload = ok; s.onerror = () => no(new Error("圖形套件載入失敗")); document.head.append(s);
});
async function openGraph() {
  if (GS) { GS.fit?.(); return; }
  GS = {};
  $("#gpanel").innerHTML = `<p class="sub">載入中…</p>`;
  try {
    const [, data] = await Promise.all([window.d3 || loadScript("https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"),
                                       fetch("data/report_graph.json", { cache: "no-cache" }).then(r => r.json())]);
    GS = buildGraph(data);
  } catch (e) { GS = null; $("#gpanel").innerHTML = `<p class="sub">關聯圖載入失敗：${esc(e.message)}</p>`; }
}
function buildGraph(G) {
  const byId = new Map(G.nodes.map(n => [n.id, n]));
  const shown = new Set(G.cats.map(c => c.key).filter(k => !G.hide.includes(k)));
  const counts = d3.rollup(G.nodes, v => v.length, n => n.cat);
  $("#gchips").innerHTML = G.cats.map(c => `<button type="button" class="gchip" data-cat="${c.key}" aria-pressed="${shown.has(c.key)}" style="--c:${CC(c.key)}"><i></i>${esc(c.name)}<b>${counts.get(c.key) || 0}</b></button>`).join("");
  $("#gchips").onclick = e => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    shown.has(b.dataset.cat) ? shown.delete(b.dataset.cat) : shown.add(b.dataset.cat);
    b.setAttribute("aria-pressed", shown.has(b.dataset.cat));
    relayout();
  };
  const svg = d3.select("#gsvg"), stage = $("#gstage");
  const root = svg.append("g"), gl = root.append("g"), gn = root.append("g");
  let nodes = [], links = [], adj = new Map(), labels = new Set(), sel = null, hov = null, k = 1, lk, nd, tx;
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let anim = null, first = true;
  const sim = d3.forceSimulation().force("charge", d3.forceManyBody().strength(-150))
    .force("x", d3.forceX().strength(0.05)).force("y", d3.forceY().strength(0.07))
    .force("collide", d3.forceCollide(d => d.r + 4)).stop();
  const place = () => {
    lk.attr("x1", l => l.source.x).attr("y1", l => l.source.y).attr("x2", l => l.target.x).attr("y2", l => l.target.y);
    nd.attr("transform", d => `translate(${d.x},${d.y})`);
  };
  sim.on("tick", place);
  const drag = d3.drag()
    .on("start", (e, d) => { settle(); if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; });
  let moved = false;     // 使用者自己縮放、平移過，就不再自動重置視角
  const zoom = d3.zoom().scaleExtent([0.25, 5]).on("zoom", e => {
    k = e.transform.k; root.attr("transform", e.transform); moved ||= !!e.sourceEvent; paint();
  });
  svg.call(zoom).on("click", () => { sel = null; paint(); });
  new ResizeObserver(() => { if (!moved) fit(); }).observe(stage);
  function fit(smooth) {
    const W = stage.clientWidth, H = stage.clientHeight;
    if (!nodes.length || !W) return;
    const [x0, x1] = d3.extent(nodes, n => n.x), [y0, y1] = d3.extent(nodes, n => n.y);
    const s = Math.min(1.8, 0.92 * Math.min(W / (x1 - x0 + 120), H / (y1 - y0 + 90)));
    const t = d3.zoomIdentity.translate(W / 2, H / 2).scale(s).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    (smooth && !RM ? svg.transition().duration(650) : svg).call(zoom.transform, t);
  }
  $("#gfit").onclick = () => { moved = false; fit(true); };
  // 版面算好之後，用動畫把每個點從起點移到新位置：開場由中心依序散開，新出現的從鄰居身邊長出來，連線跟著淡入
  function settle() {
    if (!anim) return;
    anim.stop(); anim = null;
    lk.style("opacity", null); nd.select(".dot").attr("r", d => d.r); place();
  }
  function animate(start, fresh, bloom) {
    settle();
    const T = RM ? 0 : bloom ? 900 : 650;
    if (!T) { nd.select(".dot").attr("r", d => d.r); place(); return; }
    const delay = n => bloom ? Math.hypot(n.x, n.y) * 0.8 : 0;
    const P = new Map();
    anim = d3.timer(el => {
      let done = true;
      for (const n of nodes) {
        const [x0, y0] = start.get(n.id), t = Math.min(1, Math.max(0, (el - delay(n)) / T));
        if (t < 1) done = false;
        const e = d3.easeCubicOut(t);
        P.set(n.id, [x0 + (n.x - x0) * e, y0 + (n.y - y0) * e, t]);
      }
      nd.attr("transform", d => `translate(${P.get(d.id)[0]},${P.get(d.id)[1]})`);
      nd.select(".dot").attr("r", d => fresh.has(d.id) ? d.r * d3.easeBackOut(P.get(d.id)[2]) : d.r);
      lk.attr("x1", l => P.get(l.s)[0]).attr("y1", l => P.get(l.s)[1]).attr("x2", l => P.get(l.t)[0]).attr("y2", l => P.get(l.t)[1])
        .style("opacity", l => Math.min(P.get(l.s)[2], P.get(l.t)[2]) ** 2);
      if (done) settle();
    });
  }
  function relayout() {
    const prev = new Map(nodes.map(n => [n.id, [n.x, n.y]]));
    nodes = G.nodes.filter(n => shown.has(n.cat));
    const ids = new Set(nodes.map(n => n.id)), per = new Map(), keep = new Set();
    for (const e of G.edges) if (ids.has(e.s) && ids.has(e.t))
      for (const x of [e.s, e.t]) (per.get(x) || per.set(x, []).get(x)).push(e);
    for (const es of per.values()) es.sort((a, b) => b.w - a.w).slice(0, 5).forEach(e => keep.add(e));   // 每篇最相關的 5 篇
    links = [...keep].map(e => ({ ...e, source: e.s, target: e.t }));
    adj = new Map(nodes.map(n => [n.id, []]));
    for (const l of links) { adj.get(l.s).push(l); adj.get(l.t).push(l); }
    for (const n of nodes) n.r = 5 + Math.sqrt(adj.get(n.id).length) * 2.2;
    labels = new Set([...nodes].sort((a, b) => adj.get(b.id).length - adj.get(a.id).length).slice(0, 18).map(n => n.id));
    settle();
    const out = ex => ex.transition().duration(RM ? 0 : 300).style("opacity", 0).remove();   // 關掉的類別淡出
    lk = gl.selectAll("line").data(links, l => l.s + "|" + l.t).join("line", up => up, out)
      .attr("class", l => "glk" + (l.link ? " ln" : "")).attr("stroke-width", l => 0.6 + Math.min(1, l.w) * 3);
    nd = gn.selectAll("g").data(nodes, n => n.id).join(en => {
      const g = en.append("g").attr("class", "gnd");
      g.append("circle").attr("class", "pulse"); g.append("circle").attr("class", "dot").attr("r", 0);
      g.append("text").attr("text-anchor", "middle"); g.append("title");
      return g;
    }, up => up, out);
    nd.select(".dot").attr("fill", d => CC(d.cat));
    nd.select(".pulse").attr("r", d => d.r);
    nd.select("title").text(d => `${d.full}\n${d.cname}・${d.date}`);
    tx = nd.select("text").attr("dy", d => -d.r - 4).text(d => clip(d.title, 12));
    nd.on("click", (e, d) => { e.stopPropagation(); select(d.id); })
      .on("mouseenter", (e, d) => { hov = d.id; paint(); }).on("mouseleave", () => { hov = null; paint(); })
      .call(drag);
    sim.nodes(nodes).force("link", d3.forceLink(links).id(d => d.id).distance(l => 45 + (1 - Math.min(1, l.w)) * 80).strength(l => Math.min(0.8, 0.2 + l.w)));
    // 沒有連線的報告會被斥力推得很遠，拉回來放在外圈（要在 sim.nodes 換成新的之後設）
    sim.force("x").strength(n => adj.get(n.id).length ? 0.05 : 0.3);
    sim.force("y").strength(n => adj.get(n.id).length ? 0.07 : 0.3);
    sim.alpha(1); sim.tick(300);
    const fresh = new Set(nodes.filter(n => !prev.has(n.id)).map(n => n.id));
    const start = new Map(nodes.map(n => {
      if (prev.has(n.id)) return [n.id, prev.get(n.id)];
      const nb = adj.get(n.id).map(l => prev.get(l.s === n.id ? l.t : l.s)).filter(Boolean);
      const [x, y] = nb.length ? [d3.mean(nb, p => p[0]), d3.mean(nb, p => p[1])] : first ? [0, 0] : [n.x, n.y];
      return [n.id, [x + (Math.random() - 0.5) * 24, y + (Math.random() - 0.5) * 24]];
    }));
    fit(!first);
    animate(start, fresh, first);
    first = false;
    if (!sel || !ids.has(sel)) select([...nodes].sort((a, b) => adj.get(b.id).length - adj.get(a.id).length)[0]?.id);
    else select(sel);
  }
  function paint() {
    const f = hov || sel, nb = f && adj.has(f) ? new Set([f, ...adj.get(f).map(l => l.s === f ? l.t : l.s)]) : null;
    const q = $("#q").value.trim().toLowerCase();
    const hit = q ? new Set(nodes.filter(n => (n.full + " " + n.sum + " " + n.th.join(" ")).toLowerCase().includes(q)).map(n => n.id)) : null;
    nd.classed("sel", d => d.id === sel).classed("dim", d => (nb ? !nb.has(d.id) : hit ? !hit.has(d.id) : false));
    tx.style("opacity", d => (nb ? nb.has(d.id) : hit ? hit.has(d.id) : labels.has(d.id) || k > 1.8) ? 1 : 0);
    lk.attr("class", l => "glk" + (l.link ? " ln" : "") +
      (f ? (l.s === f ? " on" : l.t === f ? " on rev" : " dim") : hit ? " dim" : ""));
  }
  function centerOn(id) {
    const n = byId.get(id), s = Math.max(d3.zoomTransform(svg.node()).k, 1.2);
    svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450)
      .call(zoom.transform, d3.zoomIdentity.translate(stage.clientWidth / 2, stage.clientHeight / 2).scale(s).translate(-n.x, -n.y));
  }
  function select(id) {
    sel = id || null; paint();
    const n = byId.get(id);
    if (!n) { $("#gpanel").innerHTML = `<p class="sub">目前沒有顯示任何報告，打開上面的類別。</p>`; return; }
    const rel = adj.get(id).slice().sort((a, b) => b.w - a.w).map((l, i) => {
      const o = byId.get(l.s === id ? l.t : l.s);
      const why = [l.link && "內文互相連結", l.txt >= 0.15 && `內容相近 ${Math.round(l.txt * 100)}%`,
                   l.co.length && `共同公司：${l.co.slice(0, 4).join("、")}${l.nco > 4 ? ` 等 ${l.nco} 家` : ""}`,
                   l.th.length && `題材：${l.th.join("、")}`].filter(Boolean).join("・") || "內容有些相近";
      return `<li style="--i:${i}"><button type="button" class="grel" data-go="${esc(o.id)}" style="--c:${CC(o.cat)}"><i></i><span class="gt">${esc(o.title)}</span><span class="gd">${esc(o.cname)}・${esc(day(o.date))}</span><span class="gw">${esc(why)}</span></button></li>`;
    }).join("");
    $("#gpanel").innerHTML = `<div class="gcat" style="--c:${CC(n.cat)}"><i></i>${esc(n.cname)}・${esc(n.date)}</div>
      <h3 class="gtitle">${esc(n.full)}</h3>
      ${n.sum ? `<p class="gsum">${esc(n.sum)}</p>` : ""}
      ${n.th.length ? `<div class="gths">${n.th.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
      <button type="button" class="gopen" data-path="${esc(n.id)}">閱讀報告 →</button>
      <h4>最相關的報告<small>${adj.get(id).length} 篇</small></h4>
      ${rel ? `<ul class="grels">${rel}</ul>` : `<p class="sub">目前顯示的類別裡沒有相關報告，可以打開上面其他類別。</p>`}`;
    $("#gpanel").scrollTop = 0;
  }
  $("#gpanel").addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (b) { select(b.dataset.go); centerOn(b.dataset.go); }
  });
  relayout();
  return { paint, fit };
}

(async function boot() {
  const L = await (await fetch("data/library.json", { cache: "no-cache" })).json();
  CATS = L.categories;
  GROUPS = L.groups || [{ key: "all", name: "報告類別", desc: "", cats: CATS }];
  ALL = CATS.flatMap(c => c.items.map(r => ({ ...r, cat: c.name })));
  HERO = L.hero || null;
  render(); hero(HERO);
  if (location.hash === "#graph") setView("graph");
  const want = new URLSearchParams(location.search).get("r");
  if (want) openDoc(want);
})().catch(e => $(".wrap").insertAdjacentHTML("beforeend", `<p class="sub">資料載入失敗：${esc(e.message)}</p>`));
</script>
</body>
