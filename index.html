<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股題材看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22 color=%22%23f5b461%22%3E%3Cg fill=%22none%22 stroke=%22currentColor%22 stroke-width=%2218%22%3E%3Cpath d=%22M150 46V45Q150 26 170 26H440Q461 26 461 47V442%22/%3E%3Cpath d=%22M111 104V75Q111 56 131 56H372L433 117V448Q433 469 412 469H132Q111 469 111 448V266%22/%3E%3Cpath d=%22M372 56V118H433%22/%3E%3Ccircle cx=%22125%22 cy=%22180%22 r=%2270%22/%3E%3Cpath d=%22M125 124V236M151 158Q151 143 125 143Q100 143 100 163Q100 180 125 180Q151 180 151 198Q151 217 125 217Q100 217 100 202%22/%3E%3Cpath d=%22M168 300H377M191 300V256H231V300M253 300V220H293V300M315 300V188H355V300%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="description" content="從產業找標的：每個題材的觀點、營收、估值、新聞熱度與候選股。">
<script>
  // 舊連結（?r=報告路徑）都在報告庫，轉過去
  if (new URLSearchParams(location.search).get("r")) location.replace("reports.html" + location.search + location.hash);
</script>
<style>
:root {
  color-scheme: dark;
  --bg: #0e0c0a; --panel: #191512; --line: #2d2620; --ink: #f2ebe3; --ink-2: #c2b3a3; --ink-3: #8c7d6e;
  --ev-2: #f0a050; --ev-4: #5b4b3d; --accent: #f5b461; --up: #ff7a5c; --down: #8fb4cc; --up-bg: #3a1d16; --down-bg: #1b2830; --chip: #221c17;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f1e8; --panel: #fffaf3; --line: #e6dccd; --ink: #1f1812; --ink-2: #5c4f43; --ink-3: #8a7b6c;
  --ev-2: #c9702e; --ev-4: #c4b5a3; --accent: #b5541c; --up: #c8432a; --down: #3f6f8f; --up-bg: #fbe3dc; --down-bg: #e1ecf2; --chip: #f3eadf;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 22px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
h1 { font-size: 24px; margin: 0; line-height: 1.25; }
header nav { margin-left: auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px; }
header nav a { text-decoration: none; color: var(--ink-2); font-weight: 600; }
header nav a:hover, header nav a[aria-current] { color: var(--accent); }
button { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.hide { display: none !important; }
h2 { font-size: 18px; margin: 0; }
.sec { margin-top: 30px; }
.sec-hd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.sec-hd p { margin: 0; color: var(--ink-3); font-size: 13px; }
.up { color: var(--up); } .down { color: var(--down); } .mute { color: var(--ink-3); }

/* 今日大盤：一行 */
.mkt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-top: 16px; padding: 10px 16px; background: var(--panel);
       border: 1px solid var(--line); border-radius: 12px; font-size: 14px; text-decoration: none; color: var(--ink); }
.mkt:hover { border-color: var(--ink-3); }
.mkt b { font-size: 18px; font-variant-numeric: tabular-nums; }
.mkt .go { margin-left: auto; color: var(--accent); font-weight: 600; }

.mktbox { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.mktbox .mkt { margin: 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0; background: none; }
.chart { padding: 10px 16px 12px; }
.chart svg { display: block; width: 100%; height: 190px; overflow: visible; }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); }
.chart .zero { stroke: var(--ink-3); stroke-dasharray: 3 3; }
.chart .band { fill: var(--accent); opacity: .13; }
.chart .pred { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .act { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.chart .live { fill: var(--ink); opacity: .05; }
.chart .hov { fill: transparent; }
.chart .hov:hover { fill: var(--ink); opacity: .06; }
.cleg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.cleg i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.cleg b { color: var(--ink-2); font-weight: 600; }
.subhd { color: var(--ink-2); font-size: 13.5px; font-weight: 600; margin: 14px 0 8px; }
.subhd small { color: var(--ink-3); font-weight: 400; margin-left: 6px; }

/* 值得先看 */
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.pick { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-decoration: none; color: var(--ink); display: block; }
.pick:hover { border-color: var(--ink-3); }
.pick .nm { font-weight: 700; font-size: 16px; }
.pick .cd { color: var(--ink-3); font-size: 12px; margin-left: 4px; }
.pick .pc { float: right; color: var(--up); font-weight: 700; font-variant-numeric: tabular-nums; }
.pick .th { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.pick .why { color: var(--ink-3); font-size: 12px; margin-top: 4px; }
.pick .wt { color: var(--ink-3); font-size: 11.5px; margin-top: 4px; }
.pick .go { color: var(--accent); font-size: 12.5px; font-weight: 600; margin-top: 8px; }

/* 題材看板 */
.board { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cols, .theme > summary { display: grid; grid-template-columns: 30px minmax(0, 1.4fr) 64px 120px 70px 64px minmax(0, 2fr); gap: 12px; align-items: center; padding: 10px 16px; }
.cols { color: var(--ink-3); font-size: 12px; border-bottom: 1px solid var(--line); }
.theme { border-bottom: 1px solid var(--line); }
.theme:last-child { border-bottom: 0; }
.theme > summary { list-style: none; cursor: pointer; font-size: 14px; }
.theme > summary::-webkit-details-marker { display: none; }
.theme > summary:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.theme > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.theme[open] > summary { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.rk { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tn { font-weight: 700; }
.tn small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.view { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 1px 9px; border-radius: 99px; background: var(--chip); color: var(--ink-2); }
.view.b { background: var(--up-bg); color: var(--up); } .view.s { background: var(--down-bg); color: var(--down); }
.num { font-variant-numeric: tabular-nums; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12.5px; padding: 1px 8px; border-radius: 6px; background: var(--chip); color: var(--ink-2); white-space: nowrap; }
.chip.b { background: var(--up-bg); color: var(--up); font-weight: 600; }
.chip.hot { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.lbl { display: none; color: var(--ink-3); font-size: 12px; margin-right: 4px; }
.detail { padding: 4px 16px 16px 58px; }
.detail table { width: 100%; border-collapse: collapse; font-size: 13px; }
.detail th, .detail td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.detail th { color: var(--ink-3); font-weight: 400; font-size: 12px; }
.detail td.r, .detail th.r { text-align: right; font-variant-numeric: tabular-nums; }
.detail .more { margin-top: 10px; font-size: 13.5px; font-weight: 600; }
.tbl-wrap { overflow-x: auto; }
@media (max-width: 860px) {
  .cols { display: none; }
  .theme > summary { grid-template-columns: 26px minmax(0, 1fr) auto; row-gap: 6px; }
  .theme > summary > .c-num, .theme > summary > .c-chips { grid-column: 2 / -1; }
  .lbl { display: inline; }
  .detail { padding: 4px 12px 14px; }
}
.legend { color: var(--ink-3); font-size: 12.5px; margin: 8px 2px 0; }

/* 新冒出的題材 */
.leads { display: flex; flex-wrap: wrap; gap: 8px; }
.lead { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; text-decoration: none; color: var(--ink); font-size: 14px; }
.lead:hover { border-color: var(--ink-3); }
.lead small { color: var(--ink-3); margin-left: 6px; }
footer { color: var(--ink-3); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span style="color:var(--accent)"><svg viewBox="0 0 512 512" width="1em" height="1em" aria-hidden="true" style="vertical-align:-.12em"><g fill="none" stroke="currentColor" stroke-width="18"><path d="M150 46V45Q150 26 170 26H440Q461 26 461 47V442"/><path d="M111 104V75Q111 56 131 56H372L433 117V448Q433 469 412 469H132Q111 469 111 448V266"/><path d="M372 56V118H433"/><circle cx="125" cy="180" r="70"/><path d="M125 124V236M151 158Q151 143 125 143Q100 143 100 163Q100 180 125 180Q151 180 151 198Q151 217 125 217Q100 217 100 202"/><path d="M168 300H377M191 300V256H231V300M253 300V220H293V300M315 300V188H355V300"/></g></svg></span> 台股題材看板</h1>
    <nav>
      <a href="index.html" aria-current="page">題材看板</a>
      <a href="reports.html">全部報告</a>
      <a href="trade.html">FVG 實驗室</a>
      <button id="themeBtn" title="切換深色／淺色" aria-label="切換深色／淺色">◐</button>
    </nav>
  </header>

  <section class="mktbox hide" id="mktbox" aria-label="今日大盤">
    <a class="mkt" id="mkt"></a>
    <div class="chart"><div id="chart"></div>
      <div class="cleg"><span><i style="background:var(--accent)"></i>預估漲跌</span><span><i style="background:var(--ink)"></i>實際漲跌</span>
        <span><i style="background:var(--accent);opacity:.3;height:8px"></i>8 成機率區間</span><span id="chartNote"></span></div></div>
  </section>

  <section class="sec hide" id="picksSec">
    <div class="sec-hd"><h2>先看這幾家</h2><p>偏多、而且股價還沒大漲的公司</p></div>
    <div class="picks" id="picks"></div>
    <div id="bigSec" class="hide"><div class="subhd">權值股<small>加權指數前 30 大，股價多半跟著大盤走，題材的影響比較小</small></div>
    <div class="picks" id="bigPicks"></div></div>
  </section>

  <section class="sec">
    <div class="sec-hd"><h2>題材看板</h2><p id="boardDate"></p></div>
    <div class="board" id="board">
      <div class="cols"><span>#</span><span>題材</span><span>觀點</span><span>營收／EPS 預估</span><span>估值</span><span>已大漲</span><span>候選股（點題材看全部）</span></div>
    </div>
    <p class="legend">候選股依合成分數排序：<span class="up">紅色＝偏多</span>，加刪除線＝股價已大漲。「已大漲」看 12 個月漲幅是自身年波動的幾倍（1.25 倍以上）：權值股波動小，漲 90% 就算大漲；小型股波動大，要漲更多才算。估值看學界模型，越便宜分數越高。</p>
  </section>

  <section class="sec hide" id="leadsSec">
    <div class="sec-hd"><h2>新冒出的題材</h2><p>新聞裡最近突然變多、還沒列進看板的名詞</p></div>
    <div class="leads" id="leads"></div>
  </section>

  <footer>研究輔助，不是投資建議。</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sgn = (x, d = 0) => x == null ? "—" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const rep = p => "reports.html?r=" + encodeURIComponent(p);
const quote = c => `https://tw.stock.yahoo.com/quote/${encodeURIComponent(c)}`;
const VIEW = { 偏多: "b", 偏空: "s" };

(function theme() {
  let t = null;
  try { t = localStorage.getItem("theme-warm"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $("#themeBtn").onclick = () => {
    const n = document.documentElement.dataset.theme !== "light" ? "light" : "dark";
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem("theme-warm", n); } catch (e) {}
  };
})();

const hot = c => c.priced === "股價已大幅反映";
// 個股報告是某一天寫的，觀點可能和今天的分數不同，連結上標出報告日期
const rdate = p => ((p || "").match(/(\d{4})-(\d{2})-(\d{2})/) || []).slice(2).join("/") || "";
const pros = c => c.pros.map(p => p.replace(/（[^）]*）/g, "")).join("、");     // 「學界估值（ML／V/P／GLS） 83%」→「學界估值 83%」
const val = a => a == null ? "—" : a >= 65 ? "便宜" : a < 50 ? "偏貴" : "合理";   // 和題材報告「學界估值中位數 < 50% 偏貴」一致

function market(h) {
  if (!h) return;
  const wd = "日一二三四五六"[new Date(h.date + "T12:00:00Z").getUTCDay()];
  const tr = (h.track || []).filter(t => t.hit != null);
  const ok = tr.filter(t => t.hit).length;
  const cls = h.p_up >= 60 ? "up" : h.p_up <= 40 ? "down" : "";
  const m = $("#mkt");
  m.href = rep(h.path);
  const isToday = h.date === new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  m.innerHTML = `<span class="mute">${isToday ? "今日大盤" : "最新盤前預估"}・${h.date.slice(5).replace("-", "/")}（${wd}）</span>
    <span>收紅機率 <b class="${cls}">${h.p_up}%</b></span>
    ${h.exp != null ? `<span>預期 <span class="${h.exp > 0 ? "up" : "down"}">${sgn(h.exp, 2)}%</span></span>` : ""}
    ${tr.length ? `<span class="mute">最近 ${tr.length} 天猜對 ${ok} 次</span>` : ""}
    <span class="go">看預估 →</span>`;
  $("#mktbox").classList.remove("hide");
}

/* 預估 vs 實際：手刻 SVG，依容器寬度重畫 */
let PM = [];
function chart() {
  const box = $("#chart"), D = PM;
  if (!D.length) return;
  const W = box.clientWidth || 600, H = 190, L = 34, R = 6, T = 8, Bm = 20;
  const vals = D.flatMap(x => [x.lo, x.hi, x.a].filter(v => v != null));
  const top = Math.max(1, Math.ceil(Math.max(...vals))), bot = Math.min(-1, Math.floor(Math.min(...vals)));
  const X = i => L + (D.length === 1 ? 0 : i * (W - L - R) / (D.length - 1));
  const Y = v => T + (top - v) * (H - T - Bm) / (top - bot);
  const step = (top - bot) > 6 ? 2 : 1;
  let g = "";
  for (let v = bot; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${v}%</text>`;
  g += `<line class="zero" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  const li = D.findIndex(x => x.live);
  if (li >= 0) g += `<rect class="live" x="${X(li) - 6}" y="${T}" width="${W - R - X(li) + 6}" height="${H - T - Bm}"/>
      <text class="ax" x="${W - R}" y="${T + 10}" text-anchor="end">正式發布</text>`;
  g += `<polygon class="band" points="${D.map((x, i) => `${X(i)},${Y(x.hi)}`).join(" ")} ${[...D].reverse().map((x, i) => `${X(D.length - 1 - i)},${Y(x.lo)}`).join(" ")}"/>`;
  g += `<polyline class="pred" points="${D.map((x, i) => `${X(i)},${Y(x.e)}`).join(" ")}"/>`;
  const A = D.map((x, i) => x.a == null ? null : `${X(i)},${Y(x.a)}`).filter(Boolean);
  g += `<polyline class="act" points="${A.join(" ")}"/>`;
  D.forEach((x, i) => { if (x.a != null) g += `<circle cx="${X(i)}" cy="${Y(x.a)}" r="2.6" fill="var(--${x.a > 0 ? "up" : "down"})"/>`; });
  const lab = new Set([0, Math.floor(D.length / 2), D.length - 1]);
  D.forEach((x, i) => { if (lab.has(i)) g += `<text class="ax" x="${X(i)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === D.length - 1 ? "end" : "middle"}">${x.d.slice(5).replace("-", "/")}</text>`; });
  const cw = (W - L - R) / Math.max(1, D.length - 1);
  D.forEach((x, i) => g += `<rect class="hov" x="${X(i) - cw / 2}" y="${T}" width="${cw}" height="${H - T - Bm}"><title>${x.d}${x.live ? "（正式發布）" : "（回測）"}
收紅機率 ${x.p}%，預估 ${sgn(x.e, 2)}%（${sgn(x.lo, 2)}% ～ ${sgn(x.hi, 2)}%）
實際 ${x.a == null ? "等收盤" : sgn(x.a, 2) + "%"}</title></rect>`);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${D.length} 個交易日預估漲跌與實際漲跌">${g}</svg>`;
  const done = D.filter(x => x.a != null);
  const hit = done.filter(x => (x.p > 50) === (x.a > 0)).length, inb = done.filter(x => x.a >= x.lo && x.a <= x.hi).length;
  $("#chartNote").innerHTML = `近 ${done.length} 天：方向猜對 <b>${hit}</b> 天、實際落在區間內 <b>${inb}</b> 天`;
}
addEventListener("resize", () => { clearTimeout(chart.t); chart.t = setTimeout(chart, 150); });

function picks(B) {
  const seen = new Set(), out = [];
  for (const t of B.themes) for (const c of t.companies)
    if (c.view === "偏多" && !hot(c) && !seen.has(c.code)) { seen.add(c.code); out.push({ ...c, theme: t.name }); }
  out.sort((a, b) => b.pct - a.pct);
  if (!out.length) return;
  // 加權指數前 30 大的權值股另外放：漲跌多半跟大盤、外資進出，不是題材挖出來的
  const big = out.filter(c => c.wr != null && c.wr <= 30), small = out.filter(c => !(c.wr != null && c.wr <= 30));
  // 有個股報告（stock-dive）就連到報告，沒有才連 Yahoo 股價頁
  const card = c => `<a class="pick" href="${c.rpt ? rep(c.rpt) : quote(c.code)}"${c.rpt ? "" : ` target="_blank" rel="noopener"`}>
      <span class="pc" title="合成分數全市場百分位">${c.pct}</span><span class="nm">${esc(c.name)}</span><span class="cd">${esc(c.code)}</span>
      <div class="th">${esc(c.theme)}${c.yoy != null ? `・營收年增 ${sgn(c.yoy)}%` : ""}</div>
      ${c.r12 != null ? `<div class="wt">股價 12 個月 ${sgn(c.r12)}%（自身波動的 ${c.mv} 倍）</div>` : ""}
      ${c.pros.length ? `<div class="why">${esc(pros(c))}</div>` : ""}
      <div class="wt">${c.w == null ? "上櫃，不在加權指數" : `指數權重 ${c.w}%（第 ${c.wr} 大）`}</div>
      ${c.rpt ? `<div class="go">看個股報告（${rdate(c.rpt)}）→</div>` : ""}</a>`;
  $("#picks").innerHTML = small.length ? small.slice(0, 8).map(card).join("") : `<p class="mute">今天沒有符合條件的中小型公司。</p>`;
  if (big.length) { $("#bigPicks").innerHTML = big.slice(0, 6).map(card).join(""); $("#bigSec").classList.remove("hide"); }
  $("#picksSec").classList.remove("hide");
}

function board(B) {
  $("#boardDate").textContent = `${B.date} 更新・${B.market.split("（")[0]}`;
  $("#board").insertAdjacentHTML("beforeend", B.themes.map(t => {
    const top = t.companies.slice(0, 5);
    const chip = c => `<span class="chip ${c.view === "偏多" ? "b" : ""} ${hot(c) ? "hot" : ""}" title="${esc(c.name)}：${esc(c.view)}，合成分數第 ${c.pct} 百分位，${esc(c.priced)}">${esc(c.name)}</span>`;
    const news = t.stage ? `新聞${t.stage}・${t.events} 則` : "近期沒有新聞";
    const rows = t.companies.map(c => `<tr><td>${c.rpt ? `<a href="${rep(c.rpt)}" title="個股報告（${rdate(c.rpt)} 寫的，觀點以當天分數為準）">${esc(c.name)}</a>` : `<a href="${quote(c.code)}" target="_blank" rel="noopener">${esc(c.name)}</a>`} <span class="mute">${esc(c.code)}</span></td>
        <td><span class="view ${VIEW[c.view] || ""}">${esc(c.view)}</span></td><td class="r">${c.pct}</td>
        <td class="r">${c.yoy == null ? "—" : sgn(c.yoy) + "%"}</td><td title="${c.mv == null ? "" : `12 個月漲幅是自身年波動的 ${c.mv} 倍`}">${esc(c.priced.replace("股價", ""))}${c.r12 == null ? "" : `<span class="mute">・${sgn(c.r12)}%</span>`}</td><td class="r">${c.w == null ? "上櫃" : c.w + "%"}</td>
        <td class="mute">${esc(pros(c))}</td></tr>`).join("");
    return `<details class="theme"><summary>
        <span class="rk">${t.rank}</span>
        <span class="tn">${esc(t.name)}<small>${esc(news)}・${t.n} 家${t.ind ? "・有產業報告" : ""}</small></span>
        <span><span class="view ${VIEW[t.view] || ""}">${esc(t.view)}</span></span>
        <span class="num c-num"><span class="lbl">營收／EPS 預估</span>${t.yoy == null ? "—" : sgn(t.yoy) + "%"}／${t.eps == null ? "—" : (t.eps >= 0 ? "上修 " : "下修 ") + Math.abs(t.eps) + "%"}</span>
        <span class="num c-num" title="學界估值中位數 ${t.aca ?? "—"}%（越高越便宜）"><span class="lbl">估值</span>${val(t.aca)}</span>
        <span class="num c-num"><span class="lbl">已大漲</span>${t.big}/${t.n}</span>
        <span class="chips c-chips">${top.map(chip).join("")}</span>
      </summary>
      <div class="detail"><div class="tbl-wrap"><table>
        <thead><tr><th>公司</th><th>觀點</th><th class="r">合成分數</th><th class="r">營收年增</th><th>股價（12 個月）</th><th class="r">指數權重</th><th>強項</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        ${t.ind ? `<div class="more ind"><a href="${rep(t.ind.path)}">看產業報告（${esc(t.ind.date.slice(5).replace("-", "/"))}）：${esc(t.ind.sum)} →</a></div>` : ""}
        ${t.path ? `<div class="more"><a href="${rep(t.path)}">看「${esc(t.name)}」題材分析 →</a></div>` : ""}
      </div></details>`;
  }).join(""));
}

function leads(B) {
  if (!B.leads?.length) return;
  $("#leads").innerHTML = B.leads.map(l => `<a class="lead" href="${l.path ? rep(l.path) : rep(B.leads_path)}">${esc(l.name)}<small>近 4 週 ${l.n4} 則・比前 12 週${esc(l.acc.replace("×", "多 ").replace(/(\d+\.\d)\d+/, "$1"))} 倍</small></a>`).join("");
  $("#leadsSec").classList.remove("hide");
}

(async function boot() {
  const B = await (await fetch("data/board.json", { cache: "no-cache" })).json();
  market(B.hero); PM = B.pm || []; chart(); picks(B); board(B); leads(B);
})().catch(e => $(".wrap").insertAdjacentHTML("beforeend", `<p class="mute">資料載入失敗：${esc(e.message)}</p>`));
</script>
</body>
</html>
