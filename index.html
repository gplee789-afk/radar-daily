<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股分析報告庫</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22 color=%22%23f5b461%22%3E%3Cg fill=%22none%22 stroke=%22currentColor%22 stroke-width=%2218%22%3E%3Cpath d=%22M150 46V45Q150 26 170 26H440Q461 26 461 47V442%22/%3E%3Cpath d=%22M111 104V75Q111 56 131 56H372L433 117V448Q433 469 412 469H132Q111 469 111 448V266%22/%3E%3Cpath d=%22M372 56V118H433%22/%3E%3Ccircle cx=%22125%22 cy=%22180%22 r=%2270%22/%3E%3Cpath d=%22M125 124V236M151 158Q151 143 125 143Q100 143 100 163Q100 180 125 180Q151 180 151 198Q151 217 125 217Q100 217 100 202%22/%3E%3Cpath d=%22M225 103H242M258 103H318M225 133H318%22/%3E%3Cpath d=%22M168 300H377M191 300V256H231V300M253 300V220H293V300M315 300V188H355V300%22/%3E%3Crect x=%22173%22 y=%22346%22 width=%2284%22 height=%2278%22/%3E%3Cpath d=%22M297 355H392M297 389H392M297 422H392%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="description" content="台股分析的所有報告：盤勢與總經、每日日報、個股報告、估值、供應鏈深挖、題材卷宗、研究與回測。">
<style>
:root {
  color-scheme: dark;
  --bg: #0e0c0a; --panel: #191512; --line: #2d2620; --grid: #3a3129; --ink: #f2ebe3; --ink-2: #c2b3a3; --ink-3: #8c7d6e; --ev-1: #ffcf8a; --ev-2: #f0a050; --ev-3: #c97a3a; --ev-4: #5b4b3d; --accent: #f5b461; --tag-auto: #2e2116; --tag-ask: #33201c; --tag-in: #2b2617;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f1e8; --panel: #fffaf3; --line: #e6dccd; --grid: #d8ccb9; --ink: #1f1812; --ink-2: #5c4f43; --ink-3: #8a7b6c; --ev-1: #a8521b; --ev-2: #c9702e; --ev-3: #dc9a5c; --ev-4: #c4b5a3; --accent: #b5541c; --tag-auto: #f6e6d3; --tag-ask: #f7e0da; --tag-in: #f6efe0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 18px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 6px; }
h1 { font-size: 24px; margin: 0; }
nav { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
input, button { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
.sub { color: var(--ink-2); font-size: 13.5px; margin: 0 0 14px; }
#q { width: min(420px, 100%); }
h2 { font-size: 17px; margin: 22px 0 10px; }

/* 最新 */
.latest { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.doc-btn { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
           color: var(--ink); transition: transform .15s, border-color .15s; }
.doc-btn:hover { transform: translateY(-2px); border-color: var(--ink-3); }
.doc-btn .k { font-size: 11.5px; color: var(--ink-3); }
.doc-btn .t { font-weight: 700; font-size: 14px; line-height: 1.45; margin-top: 2px; }

/* 類別 */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
@media (max-width: 420px) { .cats { grid-template-columns: 1fr; } }
/* 三大區塊 */
.gnav { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.gnav a { text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; font-size: 14px; font-weight: 600; }
.gnav a:hover { border-color: var(--ink-3); }
.gnav a small { font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.group { margin-top: 30px; scroll-margin-top: 12px; }
.group > h2 { font-size: 20px; margin: 0; padding-left: 12px; border-left: 4px solid var(--ev-2); line-height: 1.3; }
.group > .gdesc { color: var(--ink-2); font-size: 13.5px; margin: 6px 0 12px 16px; }
.group.method > h2 { border-left-color: var(--ev-4); font-size: 17px; }
.cat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; }
.cat .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cat h3 { font-size: 17px; margin: 0; }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; color: var(--ink-2); }
.tag.auto { background: var(--tag-auto); } .tag.ask { background: var(--tag-ask); } .tag.in { background: var(--tag-in); }
.cat .cnt { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cat .desc { font-size: 13px; color: var(--ink-2); margin: 6px 0 8px; }
.cat ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.cat li { border-bottom: 1px solid var(--line); }
.cat li button { all: unset; box-sizing: border-box; display: flex; gap: 10px; width: 100%; padding: 7px 2px; cursor: pointer; font-size: 13.5px; }
.cat li button:hover .tt, .cat li button:focus-visible .tt { color: var(--accent); }
.cat li button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
.cat li .dt { color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; width: 82px; font-size: 12.5px; padding-top: 1px; }
.cat li .tt { flex: 1; min-width: 0; }
.cat .more { margin-top: 8px; align-self: flex-start; font-size: 13px; padding: 4px 10px; }
.cat .empty { font-size: 13px; color: var(--ink-3); padding: 8px 0; }
.cat .go { margin-top: auto; padding-top: 10px; font-weight: 700; }
.hide { display: none !important; }

/* 閱讀器 */
#reader { position: fixed; inset: 0; z-index: 20; display: none; }
#reader.open { display: block; }
#reader .shade { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#reader .sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(900px, 100%); background: var(--panel); border-left: 1px solid var(--line);
                 display: flex; flex-direction: column; animation: slide .25s ease-out; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
#reader .bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#reader .bar b { font-size: 14px; color: var(--ink-2); margin-right: auto; }
#doc { overflow: auto; padding: 8px 26px 40px; flex: 1; }
#doc.frame { padding: 0; }
#doc iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
#doc h1 { font-size: 24px; margin: 14px 0 4px; }
#doc h2 { font-size: 19px; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
#doc h3 { font-size: 16px; margin: 18px 0 6px; }
#doc p, #doc li { line-height: 1.8; }
#doc table { border-collapse: collapse; font-size: 13px; margin: 10px 0; display: block; overflow-x: auto; }
#doc th, #doc td { border-bottom: 1px solid var(--line); padding: 6px 9px; text-align: left; white-space: nowrap; }
#doc th { color: var(--ink-2); }
#doc blockquote { margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--ev-2); color: var(--ink-2); background: var(--bg); border-radius: 0 8px 8px 0; }
#doc code { font-size: 12.5px; background: var(--bg); padding: 1px 5px; border-radius: 5px; }
#doc pre { overflow-x: auto; background: var(--bg); padding: 10px; border-radius: 8px; }
@media (max-width: 640px) { #doc { padding: 6px 16px 40px; } }
footer { color: var(--ink-3); font-size: 12px; margin-top: 26px; }
@media (prefers-reduced-motion: reduce) { #reader .sheet { animation: none; } .doc-btn { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span style="color:var(--accent, #f5b461)"><svg class="ico" viewBox="0 0 512 512" width="1em" height="1em" aria-hidden="true" style="vertical-align:-.12em"><g fill="none" stroke="currentColor" stroke-width="18"><path d="M150 46V45Q150 26 170 26H440Q461 26 461 47V442"/><path d="M111 104V75Q111 56 131 56H372L433 117V448Q433 469 412 469H132Q111 469 111 448V266"/><path d="M372 56V118H433"/><circle cx="125" cy="180" r="70"/><path d="M125 124V236M151 158Q151 143 125 143Q100 143 100 163Q100 180 125 180Q151 180 151 198Q151 217 125 217Q100 217 100 202"/><path d="M225 103H242M258 103H318M225 133H318"/><path d="M168 300H377M191 300V256H231V300M253 300V220H293V300M315 300V188H355V300"/><rect x="173" y="346" width="84" height="78"/><path d="M297 355H392M297 389H392M297 422H392"/></g></svg></span> 台股分析報告庫</h1>
    <nav>
      <a href="trade.html"><svg class="ico" viewBox="0 0 512 512" width="1em" height="1em" aria-hidden="true" style="vertical-align:-.12em"><g fill="currentColor"><rect x="28" y="172" width="96" height="310" rx="26"/><rect x="148" y="238" width="96" height="244" rx="26"/><rect x="268" y="304" width="96" height="178" rx="26"/><rect x="388" y="238" width="96" height="244" rx="26"/></g><path d="M62 42 197 140H258L318 218 450 80M392 77H452V137" fill="none" stroke="currentColor" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/></svg> FVG 實驗室</a>
      <button id="themeBtn" title="切換深色／淺色" aria-label="切換深色／淺色">◐</button>
    </nav>
  </header>
  <p class="sub" id="intro">這裡收著專案產出的每一種報告。標籤說明報告怎麼來的：<span class="tag auto">每天自動</span> 每晚的排程產生，<span class="tag ask">不定期更新</span> 有新題材或新研究時才寫。</p>
  <input id="q" type="search" placeholder="搜尋報告標題，例如：記憶體、玻璃基板、估值" aria-label="搜尋報告">
  <nav class="gnav" id="gnav" aria-label="報告區塊"></nav>

  <section id="latestSec">
    <h2>最近更新</h2>
    <div class="latest" id="latest"></div>
  </section>

  <div id="groups"></div>

  <footer>研究輔助，不是投資建議。分數與模型都是啟發式的，用來決定先研究什麼；新聞只當線索，數字以公開資訊觀測站、證交所與公司財報為準。</footer>
</div>

<div id="reader" aria-hidden="true">
  <div class="shade" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
    <div class="bar">
      <b id="readerTitle"></b>
      <a id="raw" target="_blank" rel="noopener">原始檔 ↗</a>
      <button data-close>✕ 關閉</button>
    </div>
    <article id="doc"></article>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TAG = { "每天自動": "auto", "每月自動": "auto", "每週更新": "auto", "不定期更新": "ask", "每天自動＋深挖": "ask" };
const SHOW = 5;
let CATS = [], ALL = [], GROUPS = [];

(function theme() {
  let t = null;
  try { t = localStorage.getItem("theme-warm"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $("#themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme !== "light";   // 預設黑底
    const n = dark ? "light" : "dark";
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem("theme-warm", n); } catch (e) {}
  };
})();

function docBtn(r, withCat) {
  return `<button class="doc-btn" data-path="${esc(r.path)}">
    <div class="k">${withCat ? esc(r.cat) + "・" : ""}${esc(r.date || "")}</div>
    <div class="t">${esc(r.title)}</div></button>`;
}
function li(r) {
  return `<li data-t="${esc(r.title.toLowerCase())}"><button data-path="${esc(r.path)}"><span class="dt">${esc(r.date || "—")}</span><span class="tt">${esc(r.title)}</span></button></li>`;
}

function render() {
  $("#latest").innerHTML = [...ALL].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 8).map(r => docBtn(r, true)).join("");
  const card = c => {
    const n = c.items.length;
    const body = c.link
      ? `<a class="go" href="${esc(c.link)}">打開日報${c.latest ? "（" + esc(c.latest) + "）" : ""} →</a>`
      : n ? `<ul>${c.items.map((r, i) => li(r).replace("<li ", `<li ${i >= SHOW ? 'data-x="1" class="hide" ' : ""}`)).join("")}</ul>
             ${n > SHOW ? `<button class="more" data-key="${c.key}">全部 ${n} 篇</button>` : ""}`
          : `<div class="empty">還沒有這類報告。</div>`;
    return `<section class="cat" data-key="${c.key}">
      <div class="hd"><h3>${esc(c.name)}</h3><span class="tag ${TAG[c.how] || "auto"}">${esc(c.how)}</span>
        <span class="cnt">${c.link ? "" : n + " 篇"}</span></div>
      <p class="desc">${esc(c.desc)}</p>${body}</section>`;
  };
  const count = g => g.cats.reduce((a, c) => a + c.items.length, 0);
  $("#gnav").innerHTML = GROUPS.map(g => `<a href="#g-${g.key}">${esc(g.name)}<small>${count(g)}</small></a>`).join("");
  $("#groups").innerHTML = GROUPS.map(g => `<section class="group ${g.key}" id="g-${g.key}">
      <h2>${esc(g.name)}</h2><p class="gdesc">${esc(g.desc)}</p>
      <div class="cats">${g.cats.map(card).join("")}</div></section>`).join("");
}

document.addEventListener("click", e => {
  const m = e.target.closest(".more");
  if (m) {
    const box = m.closest(".cat"), open = m.dataset.open === "1";
    box.querySelectorAll("li[data-x]").forEach(x => x.classList.toggle("hide", open));
    m.dataset.open = open ? "" : "1";
    m.textContent = open ? m.textContent.replace("收合", "全部") : m.textContent.replace("全部", "收合");
    return;
  }
  const b = e.target.closest("[data-path]");
  if (b) openDoc(b.dataset.path);
});

$("#q").addEventListener("input", () => {
  const q = $("#q").value.trim().toLowerCase();
  $("#latestSec").classList.toggle("hide", !!q);
  document.querySelectorAll(".cat").forEach(c => {
    let hit = 0;
    c.querySelectorAll("li").forEach(x => {
      const ok = !q ? !x.dataset.x : x.dataset.t.includes(q);
      x.classList.toggle("hide", !ok); hit += ok;
    });
    const more = c.querySelector(".more"); if (more) more.classList.toggle("hide", !!q);
    c.classList.toggle("hide", !!q && !hit);
  });
  document.querySelectorAll(".group").forEach(g => g.classList.toggle("hide", !!q && !g.querySelector(".cat:not(.hide)")));
});

/* ---------- 閱讀器 ---------- */
let lastFocus = null;
async function openDoc(path) {
  const r = ALL.find(x => x.path === path); if (!r) return;
  // 圖裡的連結會帶 #sec=段落開頭，開報告後捲到那一段
  const sec = decodeURIComponent((location.hash.match(/^#sec=(.+)$/) || [])[1] || "");
  lastFocus = document.activeElement;
  $("#reader").classList.add("open"); $("#reader").setAttribute("aria-hidden", "false");
  $("#readerTitle").textContent = r.title.startsWith(r.cat) ? r.title : r.cat + "｜" + r.title;
  $("#raw").href = r.path;
  history.replaceState(null, "", "?r=" + encodeURIComponent(path));
  const doc = $("#doc");
  if (r.kind === "html") {
    doc.className = "frame";
    doc.innerHTML = `<iframe src="${esc(r.path)}" title="${esc(r.title)}"></iframe>`;
  } else {
    doc.className = ""; doc.innerHTML = `<p class="sub">載入中…</p>`;
    try { doc.innerHTML = marked.parse(await (await fetch(r.path, { cache: "no-cache" })).text()); }
    catch (e) { doc.innerHTML = `<p>報告載入失敗：${esc(e.message)}</p>`; }
    doc.scrollTop = 0;
    const hs = [...doc.querySelectorAll("h2, h3")];
    hs.forEach((h, i) => h.id = "s" + i);
    const hit = sec && hs.find(h => h.textContent.trim().startsWith(sec));
    if (hit) doc.scrollTop = hit.getBoundingClientRect().top - doc.getBoundingClientRect().top - 8;
  }
  $("#reader [data-close]").focus({ preventScroll: true });
}
function closeReader() {
  $("#reader").classList.remove("open"); $("#reader").setAttribute("aria-hidden", "true");
  $("#doc").innerHTML = "";
  history.replaceState(null, "", location.pathname);
  lastFocus?.focus?.();
}
document.querySelectorAll("[data-close]").forEach(el => el.onclick = closeReader);
addEventListener("keydown", e => { if (e.key === "Escape" && $("#reader").classList.contains("open")) closeReader(); });

(async function boot() {
  const L = await (await fetch("data/library.json", { cache: "no-cache" })).json();
  CATS = L.categories;
  GROUPS = L.groups || [{ key: "all", name: "報告類別", desc: "", cats: CATS }];
  ALL = CATS.flatMap(c => c.items.map(r => ({ ...r, cat: c.name })));
  render();
  const want = new URLSearchParams(location.search).get("r");
  if (want) openDoc(want);
})().catch(e => $(".wrap").insertAdjacentHTML("beforeend", `<p class="sub">資料載入失敗：${esc(e.message)}</p>`));
</script>
</body>
</html>
